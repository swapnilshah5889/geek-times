<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Comic panel: the match meter</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
.pm-w{font:bold 20px Georgia,serif;fill:#28261e}.pm-micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px;fill:#28261e}
.pm-sfx{font:italic 900 22px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke}
.pm-meter{transform-box:fill-box;transform-origin:left center;animation:pm-meter 6s ease-out infinite}
.pm-pulse{transform-box:fill-box;transform-origin:center;animation:pm-pulse 1.8s ease-in-out infinite}
@keyframes pm-meter{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}@keyframes pm-pulse{50%{transform:scale(1.1)}}
@media(prefers-reduced-motion:reduce){.pm-meter,.pm-pulse{animation:none}}
</style>
</helmet>
<div style="width: 100%; line-height: 0; background: #f0e3c6;">
<svg viewBox="0 0 320 220" role="img" aria-label="A match meter: The 10 percent, bat 20 percent, flew 70 percent." style="display: block; width: 100%; height: auto;">
<defs><pattern id="pm-dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"></circle></pattern></defs>
<rect width="320" height="220" fill="#f0e3c6"></rect><rect width="320" height="220" fill="url(#pm-dots)" opacity=".22"></rect>
<text x="160" y="30" class="pm-micro" text-anchor="middle">MATCH-O-METER</text>
<text x="18" y="68" class="pm-w" text-anchor="start">The</text><rect x="76" y="52" width="170" height="22" fill="#ddcfb0" stroke="#322e24" stroke-width="2"></rect><rect class="pm-meter" x="76" y="52" width="17" height="22" fill="#cfa64b"></rect><text x="302" y="70" class="pm-w" text-anchor="end">10%</text>
<text x="18" y="114" class="pm-w" text-anchor="start">bat</text><rect x="76" y="98" width="170" height="22" fill="#ddcfb0" stroke="#322e24" stroke-width="2"></rect><rect class="pm-meter" x="76" y="98" width="34" height="22" fill="#c86f3f" style="animation-delay: .25s;"></rect><text x="302" y="116" class="pm-w" text-anchor="end">20%</text>
<text x="18" y="160" class="pm-w" text-anchor="start">flew</text><rect x="76" y="144" width="170" height="22" fill="#ddcfb0" stroke="#322e24" stroke-width="2"></rect><rect class="pm-meter" x="76" y="144" width="119" height="22" fill="#377675" style="animation-delay: .5s;"></rect><text x="302" y="162" class="pm-w" text-anchor="end">70%</text>
<g class="pm-pulse"><text x="160" y="204" class="pm-sfx" text-anchor="middle">“flew” matches best!</text></g>
</svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":320,"height":220}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
