round"/><polygon points="99.6,70.0 110.0,76.0 110.0,88.0 99.6,94.0 89.2,88.0 89.2,76.0" fill="#f0e3c6" fill-opacity="0.9" stroke="#322e24" stroke-width="1.4" stroke-linejoin="round"/><polygon points="120.4,70.0 130.8,76.0 130.8,88.0 120.4,94.0 110.0,88.0 110.0,76.0" fill="#efae78" fill-opacity="0.9" stroke="#322e24" stroke-width="1.4" stroke-linejoin="round"/><path d="M150 140L184 178" stroke="#322e24" stroke-width="10" stroke-linecap="round"/><circle cx="110" cy="100" r="54" fill="none" stroke="#322e24" stroke-width="4"/><rect x="190" y="22" width="110" height="54" rx="16" fill="#fff8e3" stroke="#322e24" stroke-width="2"/><path d="M249 74L258 140L267 74" fill="#fff8e3" stroke="#322e24" stroke-width="2" stroke-linejoin="round"/><text x="245.0" y="45" class="b" text-anchor="middle">Zoom in</text><text x="245.0" y="65" class="b" text-anchor="middle">again!</text><g transform="translate(258 178) scale(0.7)"><use href="#wb" style="color:#c3b2d8"/></g><rect x="62.0" y="194" width="196.0" height="22" rx="5" fill="#fff8e3" stroke="#322e24" stroke-width="1.5"/><text x="160" y="209" class="micro" text-anchor="middle">EVERY SMALL CELL SPLITS</text></svg>
