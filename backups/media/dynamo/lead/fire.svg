 -8Z" fill="#f7d79b"/></g></g><g class="m-shake"><text x="135" y="280" class="sfx" text-anchor="middle">FWOOSH!</text></g><text x="135" y="298" class="micro" text-anchor="middle">SERVER</text><path d="M386 224h120v14h-120zM430 206h32v20h-32z" fill="#b5ab92" stroke="#322e24" stroke-width="3" stroke-linejoin="round"/><rect x="352" y="76" width="188" height="132" rx="10" fill="#d8cfb8" stroke="#322e24" stroke-width="3.5"/><rect x="364" y="88" width="164" height="108" rx="4" fill="#3d4a45" stroke="#322e24" stroke-width="2"/><rect x="372" y="96" width="148" height="92" rx="3" fill="#f6ead0"/><g transform="translate(446 148) scale(1.45)"><path d="M-34 -22H-24L-16 14H22" fill="none" stroke="#322e24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M-22 -12H30L24 8H-17Z" fill="#fff8e3" stroke="#322e24" stroke-width="3" stroke-linejoin="round"/><path d="M-6 -12L-4 8M10 -12L9 8" stroke="#322e24" stroke-width="1.5" opacity=".5"/><circle cx="-12" cy="22" r="5" fill="#322e24"/><circle cx="16" cy="22" r="5" fill="#322e24"/><g transform="translate(-8 -17) scale(0.7)"><path d="M-14 -8L-4 -10L2 -2Q14 -2 15 6V9H-14Z" fill="#a13324" stroke="#322e24" stroke-width="2" stroke-linejoin="round"/><path d="M-14 6H15" stroke="#f6f0df" stroke-width="2"/></g><g transform="translate(14 -17) scale(0.7)"><ellipse cx="0" cy="6" rx="17" ry="4" fill="#377675" stroke="#322e24" stroke-width="2"/><path d="M-10 6Q-10 -10 0 -10T10 6Z" fill="#377675" stroke="#322e24" stroke-width="2" stroke-linejoin="round"/><path d="M-10 2H10" stroke="#f7d79b" stroke-width="2.5"/></g></g><text x="446" y="112" class="micro" text-anchor="middle">YOUR CART</text><g class="m-bob"><circle cx="518" cy="82" r="20" fill="#a2c2a7" stroke="#322e24" stroke-width="3"/><path d="M509 82l7 8 12-15" fill="none" stroke="#322e24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M262 160H338" stroke="#a13324" stroke-width="3.5" stroke-dasharray="6 6" stroke-linecap="round" marker-end="url(#ah)"/><text x="446" y="262" class="w-s" text-anchor="middle" style="fill:#a13324">still there</text><rect x="10" y="288" width="580" height="44" fill="#fbf3dc" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="317" class="b" text-anchor="middle">The machine is on fire. Your cart does not care.</text><text x="22" y="28" class="micro" text-anchor="start" style="fill:#a13324">PLATE 01 / FIRE</text><path d="M8 10Q300 5 592 9Q596 170 591 332Q300 336 9 331Q4 170 8 10Z" fill="none" stroke="#322e24" stroke-width="3.5" stroke-linejoin="round"/></svg>
