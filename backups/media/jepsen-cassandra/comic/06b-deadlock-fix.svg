<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A stuck door with a jam; a helper hands over a patched key</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
.sfx,.sfx-s{font:italic 900 30px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke;letter-spacing:-.02em}
.sfx-s{font-size:22px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f6f0df"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(90 105)" stroke="#322e24" stroke-width="3" stroke-linejoin="round"><rect x="-40" y="-55" width="80" height="110" fill="#d9b98a"/><circle cx="24" cy="5" r="5" fill="#ffe597"/></g><path d="M70 70l-10 12l-4 -10l-8 6" stroke="#a13324" stroke-width="4" fill="none" stroke-linecap="round"/><text x="70" y="38" text-anchor="middle" class="sfx-s" transform="rotate(-10 70 38)">JAM!</text><g transform="translate(230 100) scale(1.2)"><use href="#wb" style="color:#a2c2a7"/><text x="0" y="12" class="w-s" text-anchor="middle">helper</text></g><g transform="translate(190 140) rotate(-30)" stroke="#322e24" stroke-width="2.5"><circle r="9" fill="#ffe597"/><rect x="8" y="-3" width="30" height="6" fill="#ffe597"/></g><path d="M185 150Q150 150 125 120" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" class="m-flow"/><text x="160" y="198" text-anchor="middle" class="b-s">A patched key frees the stuck door.</text></svg>
