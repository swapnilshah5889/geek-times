<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A runner goes to the desk to read, comes back, then goes again to write</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f6f0df"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(250 100) scale(1.4)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none" stroke-width="3"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="#d9b98a"/><rect x="-10" y="-16" width="20" height="10" rx="1.5" fill="#fff8e3" stroke-width="2"/></g><g transform="translate(60 100) scale(1.0)"><use href="#wb" style="color:#efae78"/><text x="0" y="12" class="w-s" text-anchor="middle">runner</text></g><path d="M100 80Q175 40 220 70" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" class="m-flow"/><path d="M220 105Q175 125 105 105" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)"/><text x="165" y="36" class="b-s" text-anchor="middle">trip 1: read</text><text x="165" y="140" class="b-s" text-anchor="middle">back with the answer</text><path d="M100 160Q180 185 225 140" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round" marker-end="url(#ah)" class="m-flow"/><text x="120" y="190" class="b-s" text-anchor="middle">trip 2: write</text><text x="160" y="210" text-anchor="middle" class="b-s">Read, then write: two trips.</text></svg>
