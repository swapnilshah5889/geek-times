<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>A company badge stamped on a report page with a short list of reasons, no charts, and a question mark where numbers would go.</title><style>text{fill:#28261e;font:17px Georgia,serif}
