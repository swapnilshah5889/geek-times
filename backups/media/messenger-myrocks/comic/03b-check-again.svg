<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A librarian compares a counter before and after copying; the numbers differ, so the librarian shakes a head and sweeps the new copy away.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.big{font:bold 34px Georgia,serif}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(70 110) scale(1.1)"><use href="#wb" style="color:#c3b2d8"/><text x="0" y="12" class="w" text-anchor="middle">check</text></g><rect x="140" y="40" width="62" height="40" rx="5" fill="#fff8e3" stroke="#322e24" stroke-width="2.5" /><text x="171" y="66" class="b-s" text-anchor="middle">before</text><rect x="242" y="40" width="62" height="40" rx="5" fill="#fff8e3" stroke="#322e24" stroke-width="2.5" /><text x="273" y="66" class="b-s" text-anchor="middle">after</text><text x="222" y="68" class="big" text-anchor="middle" style="fill:#a13324">≠</text><g transform="translate(200 150) rotate(0)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"><path d="M-25.0 -11.0V-17.0Q-25.0 -21.0 -21.0 -21.0H-7.0L-1.0 -15.0H25.0V-11.0Z" fill="#f7d79b" opacity=".85"/><rect x="-25.0" y="-12.0" width="50" height="29" rx="3" fill="#f7d79b"/><path d="M-17.0 5.0h25" stroke-width="1.8" opacity=".5" fill="none"/></g><path d="M265 190Q230 170 175 190" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round"  marker-end="url(#ah)"/><text x="228" y="120" class="b-s" text-anchor="middle">Differ? Start again.</text></svg>
