<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A spinning disk crossed out on the left and a small flat flash card with a sparkle on the right.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-spin{animation:m-spin 3s linear infinite}
.m-twinkle{animation:m-twinkle 2.4s ease-in-out infinite}
@keyframes m-spin{to{transform:rotate(360deg)}}
@keyframes m-twinkle{50%{transform:scale(.5);opacity:.4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g class="m-spin"><circle cx="80" cy="100" r="44" fill="#8a867a" stroke="#322e24" stroke-width="3"/><circle cx="80" cy="100" r="15.4" fill="#fff8e3" stroke="#322e24" stroke-width="2"/><path d="M44.8 100a35.2 35.2 0 0 1 35.2 -35.2" fill="none" stroke="#fff8e3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></g><path d="M52 72L108 128M108 72L52 128" fill="none" stroke="#a13324" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" /><rect x="184" y="70" width="90" height="62" rx="6" fill="#6d9a9a" stroke="#322e24" stroke-width="3" /><path d="M204 70v-16M224 70v-16M244 70v-16" fill="none" stroke="#b5ab92" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" /><use href="#mstar" transform="translate(268 66) scale(1.6)" class="m-twinkle"/><use href="#mstar" transform="translate(190 142) scale(1.1)" class="m-twinkle"/><text x="80" y="176" class="b-s" text-anchor="middle">Spinning disk</text><text x="229" y="176" class="b-s" text-anchor="middle">Flash card</text></svg>
