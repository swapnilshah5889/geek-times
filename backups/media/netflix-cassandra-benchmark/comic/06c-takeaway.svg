<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A happy engineer pointing at a very long straight line, with a Netflix reports tag.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
@keyframes m-bob{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><text x="12" y="20" class="micro" text-anchor="start" style="fill:#a13324">FROM THE SOURCE · REPORTED</text><g class="m-bob"><g transform="translate(80 110) scale(1.3)"><use href="#wb" style="color:#a2c2a7"/></g></g><path d="M120 100H292" stroke="#a13324" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/><g transform="translate(220 60) rotate(-5)"><rect x="-75.0" y="-14" width="150" height="28" rx="4" fill="#fff8e3" stroke="#a13324" stroke-width="2.5"/><text x="0" y="5" class="micro" text-anchor="middle" style="fill:#a13324">NETFLIX REPORTS</text></g><text x="205" y="130" class="b-s" text-anchor="middle">a very long straight line</text><text x="160" y="206" class="b-s" text-anchor="middle">Netflix’s own view</text></svg>
