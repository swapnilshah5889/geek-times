<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>An engineer clicks one big button and empty desks pop up one by one.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-loop-pop{animation:m-loop-pop 4.5s ease-out infinite}
.m-hop{animation:m-hop 2.4s ease-in-out infinite}
@keyframes m-loop-pop{0%{transform:scale(0)}10%{transform:scale(1.2)}16%,88%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes m-hop{0%,40%,100%{transform:none}20%{transform:translateY(-14px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><g id="dk" stroke="#322e24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="currentColor"/><rect x="-10" y="-17" width="20" height="11" rx="1.5" fill="#fff8e3" stroke-width="2.5"/></g></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><text x="12" y="20" class="micro" text-anchor="start" style="fill:#a13324">FROM THE SOURCE · REPORTED</text><g class="m-hop"><g transform="translate(48 100) scale(1)"><use href="#wb" style="color:#c3b2d8"/></g></g><rect x="20" y="150" width="56" height="26" rx="6" fill="#a13324" stroke="#322e24" stroke-width="3"/><text x="48" y="168" class="w-s" text-anchor="middle" style="fill:#fff8e3">GO</text><g class="m-loop-pop" style="animation-delay:0.0s;"><use href="#dk" transform="translate(130 70) scale(0.85)" style="color:#d9b98a"/></g><g class="m-loop-pop" style="animation-delay:0.5s;"><use href="#dk" transform="translate(200 70) scale(0.85)" style="color:#d9b98a"/></g><g class="m-loop-pop" style="animation-delay:1.0s;"><use href="#dk" transform="translate(270 70) scale(0.85)" style="color:#d9b98a"/></g><g class="m-loop-pop" style="animation-delay:1.5s;"><use href="#dk" transform="translate(130 130) scale(0.85)" style="color:#d9b98a"/></g><g class="m-loop-pop" style="animation-delay:2.0s;"><use href="#dk" transform="translate(200 130) scale(0.85)" style="color:#d9b98a"/></g><g class="m-loop-pop" style="animation-delay:2.5s;"><use href="#dk" transform="translate(270 130) scale(0.85)" style="color:#d9b98a"/></g><text x="160" y="208" class="b-s" text-anchor="middle">a ring in about an hour</text></svg>
