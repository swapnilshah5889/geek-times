<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A chart with four dots on one straight line and a looker saying still even.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b{font:18px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
.m-loop-pop{animation:m-loop-pop 4.5s ease-out infinite}
@keyframes m-bob{to{transform:translateY(-7px)}}
@keyframes m-loop-pop{0%{transform:scale(0)}10%{transform:scale(1.2)}16%,88%{transform:scale(1)}100%{transform:scale(0)}}
