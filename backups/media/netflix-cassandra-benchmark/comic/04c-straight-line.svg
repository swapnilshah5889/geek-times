text-anchor="middle">96</text><text x="126.39999999999999" y="192" class="micro" text-anchor="middle">144</text><text x="212.79999999999998" y="192" class="micro" text-anchor="middle">288</text><g class="m-bob"><g transform="translate(270 150) scale(0.8)"><use href="#wb" style="color:#c3b2d8"/></g></g><rect x="238" y="30" width="76" height="56" rx="16" fill="#fff8e3" stroke="#322e24" stroke-width="2"/><path d="M275 86L278 112L262 86" fill="#fff8e3" stroke="#322e24" stroke-width="2" stroke-linejoin="round"/><text x="276" y="55" class="b" text-anchor="middle">still</text><text x="276" y="75" class="b" text-anchor="middle">even</text><text x="160" y="214" class="b-s" text-anchor="middle">speed grew in a straight line</text></svg>
