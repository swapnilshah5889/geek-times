<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>Desks inside soap bubbles pop into existence for the test, then vanish.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
@keyframes m-bob{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><g id="dk" stroke="#322e24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="currentColor"/><rect x="-10" y="-17" width="20" height="11" rx="1.5" fill="#fff8e3" stroke-width="2.5"/></g></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><text x="12" y="20" class="micro" text-anchor="start" style="fill:#a13324">FROM THE SOURCE · REPORTED</text><g class="m-bob" style="animation-delay:0.0s"><circle cx="70" cy="80" r="40" fill="#c9e3e2" fill-opacity=".45" stroke="#322e24" stroke-width="2.5"/><path d="M44 66a28 28 0 0 1 14 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><use href="#dk" transform="translate(70 82) scale(0.8)" style="color:#d9b98a"/><g class="m-bob" style="animation-delay:0.3s"><circle cx="160" cy="60" r="40" fill="#c9e3e2" fill-opacity=".45" stroke="#322e24" stroke-width="2.5"/><path d="M134 46a28 28 0 0 1 14 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><use href="#dk" transform="translate(160 62) scale(0.8)" style="color:#d9b98a"/><g class="m-bob" style="animation-delay:0.6s"><circle cx="250" cy="80" r="40" fill="#c9e3e2" fill-opacity=".45" stroke="#322e24" stroke-width="2.5"/><path d="M224 66a28 28 0 0 1 14 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><use href="#dk" transform="translate(250 82) scale(0.8)" style="color:#d9b98a"/><g class="m-bob" style="animation-delay:0.8999999999999999s"><circle cx="110" cy="150" r="40" fill="#c9e3e2" fill-opacity=".45" stroke="#322e24" stroke-width="2.5"/><path d="M84 136a28 28 0 0 1 14 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><use href="#dk" transform="translate(110 152) scale(0.8)" style="color:#d9b98a"/><g class="m-bob" style="animation-delay:1.2s"><circle cx="210" cy="150" r="40" fill="#c9e3e2" fill-opacity=".45" stroke="#322e24" stroke-width="2.5"/><path d="M184 136a28 28 0 0 1 14 -14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></g><use href="#dk" transform="translate(210 152) scale(0.8)" style="color:#d9b98a"/><text x="160" y="212" class="b-s" text-anchor="middle">here for the test, then gone</text></svg>
