<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>One desk falls with a cross on it and a new desk slides into the same spot.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.slr{animation:sr 5s ease-in-out infinite}
@keyframes sr{0%{transform:translateX(70px)}40%,100%{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><g id="dk" stroke="#322e24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="currentColor"/><rect x="-10" y="-17" width="20" height="11" rx="1.5" fill="#fff8e3" stroke-width="2.5"/></g></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><use href="#dk" transform="translate(80 140) scale(1.1)" style="color:#b5ab92"/><g transform="translate(80 140)"><path d="M-20-20L20 20M20-20L-20 20" stroke="#a13324" stroke-width="5" stroke-linecap="round"/></g><g class="slr"><use href="#dk" transform="translate(215 120) scale(1.3)" style="color:#a2c2a7"/></g><path d="M150 150h130" stroke="#322e24" stroke-width="3" stroke-dasharray="4 6" opacity=".5"/><text x="160" y="208" class="b-s" text-anchor="middle">a new desk takes its place</text></svg>
