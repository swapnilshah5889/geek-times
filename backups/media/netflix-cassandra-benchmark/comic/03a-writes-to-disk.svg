<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A note travels down through a desk and ends in a folder on a shelf.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><g id="dk" stroke="#322e24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="currentColor"/><rect x="-10" y="-17" width="20" height="11" rx="1.5" fill="#fff8e3" stroke-width="2.5"/></g><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(100 24) rotate(0) scale(1.1)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-9" width="26" height="18" rx="2" fill="#fff8e3"/><path d="M-13 -9L0 2L13 -9" fill="none"/></g><path d="M100 40V80" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><use href="#dk" transform="translate(100 100) scale(1.4)" style="color:#d9b98a"/><path d="M100 125V160" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><rect x="190" y="150" width="110" height="14" fill="#d9b98a" stroke="#322e24" stroke-width="3"/><g transform="translate(215 128)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"><path d="M-20.0 -15.0h16l6 6h18V15.0H-20.0Z" fill="#f7d79b"/><path d="M-12.0 5.0h20" stroke-width="1.8" opacity=".5" fill="none"/></g><g transform="translate(260 128)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"><path d="M-20.0 -15.0h16l6 6h18V15.0H-20.0Z" fill="#a2c2a7"/><path d="M-12.0 5.0h20" stroke-width="1.8" opacity=".5" fill="none"/></g><text x="160" y="200" class="b-s" text-anchor="middle">writes go all the way to disk</text></svg>
