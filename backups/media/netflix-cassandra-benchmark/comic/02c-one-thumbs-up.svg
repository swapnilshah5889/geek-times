dk" transform="translate(235 150) scale(0.8)" style="color:#d9b98a"/><g class="m-wiggle"><g transform="translate(255 70) rotate(-30)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="0" y="-5" width="34" height="10" fill="#efae78"/><path d="M0 -5L-12 0L0 5Z" fill="#f7d79b"/><rect x="34" y="-5" width="7" height="10" fill="#d98b8b"/></g></g><g class="m-wiggle"><g transform="translate(255 130) rotate(-30)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="0" y="-5" width="34" height="10" fill="#efae78"/><path d="M0 -5L-12 0L0 5Z" fill="#f7d79b"/><rect x="34" y="-5" width="7" height="10" fill="#d98b8b"/></g></g><text x="160" y="208" class="b-s" text-anchor="middle">thumbs-up after just one</text></svg>
