<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>One desk raises a thumbs-up to the sender while two others are still writing.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
.m-wiggle{animation:m-wiggle 1.4s ease-in-out infinite}
@keyframes m-bob{to{transform:translateY(-7px)}}
@keyframes m-wiggle{0%,60%,100%{transform:none}70%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-4deg)}}
