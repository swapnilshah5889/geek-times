<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A desk quickly scribbles in a notebook with a stopwatch showing a tiny time.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-wiggle{animation:m-wiggle 1.4s ease-in-out infinite}
@keyframes m-wiggle{0%,60%,100%{transform:none}70%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-4deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><g id="dk" stroke="#322e24" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="currentColor"/><rect x="-10" y="-17" width="20" height="11" rx="1.5" fill="#fff8e3" stroke-width="2.5"/></g></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><text x="12" y="20" class="micro" text-anchor="start" style="fill:#a13324">FROM THE SOURCE · REPORTED</text><use href="#dk" transform="translate(80 130) scale(1.4)" style="color:#d9b98a"/><g transform="translate(80 78) scale(0.6)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"><rect x="-32" y="-42" width="64" height="84" rx="4" fill="#fff8e3"/><path d="M-32 -42v84" stroke="#a13324" stroke-width="3"/><path d="M-22 -28h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 -14h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 0h4