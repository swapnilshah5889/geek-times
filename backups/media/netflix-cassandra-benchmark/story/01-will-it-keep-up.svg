<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>A small ring of desks and a worried engineer with a question mark; a bigger ring waits behind.</title><style>text{fill:#28261e;font:17px Georgia,serif}
