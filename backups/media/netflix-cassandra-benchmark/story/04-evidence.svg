<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>A counter reading 1.1 million beside a bigger counter reading 3.3 million, with a tag saying Netflix reports this.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
.mono{font:bold 20px 'Courier New',monospace}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="440" height="215" fill="#e8e2cc"/><rect width="440" height="215" fill="url(#dots)" opacity=".22"/><text x="12" y="20" class="micro" text-anchor="start" style="fill:#a13324">FROM THE SOURCE · REPORTED</text><rect x="20" y="60" width="190" height="74" rx="8" fill="#322e24"/><rect x="26" y="66" width="178" height="62" rx="4" fill="#f7d79b"/><text x="115" y="108" class="mono" text-anchor="middle" style="font-size:23px">1.1 million</text><text x="115" y="154" class="b-s" text-anchor="middle">client writes a second</text><rect x="236" y="48" width="190" height="94" rx="8" fill="#322e24"/><rect x="242" y="54" width="178" height="82" rx="4" fill="#a2c2a7"/><text x="331" y="104" class="mono" text-anchor="middle" style="font-size:23px">3.3 million</text><text x="331" y="164" class="b-s" text-anchor="middle">writes a second in total</text><text x="331" y="180" class="b-s" text-anchor="middle">(each write kept 3 times)</text><path d="M210 98h16" stroke="#a13324" stroke-width="4" marker-end="url(#ah)"/><text x="120" y="190" class="b-s" text-anchor="middle"></text><g transform="translate(100 195) rotate(-3)"><rect x="-95.0" y="-14" width="190" height="28" rx="4" fill="#fff8e3" stroke="#a13324" stroke-width="2.5"/><text x="0" y="5" class="micro" text-anchor="middle" style="fill:#a13324">NETFLIX REPORTS THIS</text></g></svg>
