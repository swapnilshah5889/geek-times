<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>Four runners on the same track under one starting flag</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b{font:18px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
.sfx,.sfx-s{font:italic 900 30px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke;letter-spacing:-.02em}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-wobble{animation:m-wobble 1.8s ease-in-out infinite alternate}
@keyframes m-wobble{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="600" height="340" fill="#e9e1c8"/><rect width="600" height="340" fill="url(#dots)" opacity=".22"/><rect x="150" y="70" width="80" height="190" fill="#f0e3c6" stroke="#322e24" stroke-width="2.5"/><g transform="translate(190 215) scale(1)"><use href="#wb" style="color:#efae78"/><text x="0" y="12" class="w-s" text-anchor="middle">Cass</text></g><rect x="230" y="70" width="80" height="190" fill="#fff8e3" stroke="#322e24" stroke-width="2.5"/><g transform="translate(270 215) scale(1)"><use href="#wb" style="color:#a2c2a7"/><text x="0" y="12" class="w-s" text-anchor="middle">HBase</text></g><rect x="310" y="70" width="80" height="190" fill="#f0e3c6" stroke="#322e24" stroke-width="2.5"/><g transform="translate(350 215) scale(1)"><use href="#wb" style="color:#c3b2d8"/><text x="0" y="12" class="w-s" text-anchor="middle">PNUTS</text></g><rect x="390" y="70" width="80" height="190" fill="#fff8e3" stroke="#322e24" stroke-width="2.5"/><g transform="translate(430 215) scale(1)"><use href="#wb" style="color:#f7d79b"/><text x="0" y="12" class="w-s" text-anchor="middle">MySQL</text></g><path d="M150 232H470" stroke="#a13324" stroke-width="5"/><path d="M110 270V70" stroke="#322e24" stroke-width="4" stroke-linecap="round"/><g class="m-wobble"><path d="M110 74h70v34h-70Z" fill="#a13324" stroke="#322e24" stroke-width="3" stroke-linejoin="round"/><path d="M122 74v34M146 74v34M170 74v34" stroke="#fff8e3" stroke-width="6" opacity=".7"/></g><rect x="526" y="116" width="8" height="7" fill="#b5ab92" stroke="#322e24" stroke-width="2"/><circle cx="530" cy="160" r="36" fill="#fff8e3" stroke="#322e24" stroke-width="3"/><path d="M530 160L530 129A31 31 0 0 1 560.5 154.2Z" fill="#a13324" opacity=".55"/><path d="M530 160L559.5 154.4" stroke="#322e24" stroke-width="3" stroke-linecap="round"/><circle cx="530" cy="160" r="3" fill="#322e24"/><text x="530" y="222" class="b-s" text-anchor="middle">same timer</text><text x="310" y="62" class="sfx" text-anchor="middle">GO!</text><rect x="10" y="288" width="580" height="44" fill="#fbf3dc" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="317" class="b" text-anchor="middle">One test, one track, one stopwatch for every store.</text><text x="22" y="28" class="micro" text-anchor="start" style="fill:#a13324">SAME RACE!</text><path d="M8 10Q300 5 592 9Q596 170 591 332Q300 336 9 331Q4 170 8 10Z" fill="none" stroke="#322e24" stroke-width="3.5" stroke-linejoin="round"/></svg>
