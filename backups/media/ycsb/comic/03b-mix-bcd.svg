<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>Three pies: mostly reads, all reads, newest records</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-twinkle{animation:m-twinkle 2.4s ease-in-out infinite}
@keyframes m-twinkle{50%{transform:scale(.5);opacity:.4}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#ece3cb"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><path d="M55 95L55.0 55.0A40 40 0 1 1 42.6 57.0Z" fill="#a2c2a7" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><path d="M55 95L42.6 57.0A40 40 0 0 1 55.0 55.0Z" fill="#efae78" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><text x="55" y="160" class="b-s" text-anchor="middle">B: 95 / 5</text><circle cx="160" cy="95" r="40" fill="#a2c2a7" stroke="#322e24" stroke-width="2.5"/><text x="160" y="160" class="b-s" text-anchor="middle">C: reads only</text><circle cx="265" cy="95" r="40" fill="#a2c2a7" stroke="#322e24" stroke-width="2.5"/><text x="265" y="160" class="b-s" text-anchor="middle">D: newest</text><g class="m-twinkle"><use href="#mstar" transform="translate(290 62) scale(2)"/></g><text x="265" y="95" class="w-s" text-anchor="middle">new</text><text x="55" y="38" class="micro" text-anchor="middle">photo tags</text><text x="10" y="205" class="micro" text-anchor="start" style="fill:#a13324">From the paper · setup</text></svg>
