<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A small new tool with a price tag beside a worn one</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-wobble{animation:m-wobble 1.8s ease-in-out infinite alternate}
@keyframes m-wobble{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
