<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A long record card with ten small boxes</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#e9e1c8"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect x="15" y="72" width="290" height="70" rx="8" fill="#fff8e3" stroke="#322e24" stroke-width="3"/><rect x="25" y="86" width="23" height="42" rx="3" fill="#f7d79b" stroke="#322e24" stroke-width="2"/><rect x="53" y="86" width="23" height="42" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><rect x="81" y="86" width="23" height="42" rx="3" fill="#f7d79b" stroke="#322e24" stroke-width="2"/><rect x="109" y="86" width="23" height="42" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><rect x="137" y="86" width="23" height="42" rx="3" fill="#f7d79b" stroke="#322e24" stroke-width="2"/><rect x="165" y="86" width="23" height="42" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><rect x="193" y="86" width="23" height="42" rx="3" fill="#f7d79b" stroke="#322e24" stroke-width="2"/><rect x="221" y="86" width="23" height="42" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><rect x="249" y="86" width="23" height="42" rx="3" fill="#f7d79b" stroke="#322e24" stroke-width="2"/><rect x="277" y="86" width="23" height="42" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><text x="160" y="58" class="w-s" text-anchor="middle">one record = 10 fields</text><text x="160" y="172" class="b-s" text-anchor="middle">100 bytes each, about 1,000 in all</text><text x="10" y="210" class="micro" text-anchor="start" style="fill:#a13324">From the paper · setup</text></svg>
