<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>Five machines pass heavy boxes to a sixth new machine while a clock shows a long wait</title><style>text{fill:#28261e;font:17px Georgia,serif}
