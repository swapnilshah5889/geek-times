<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>A reader holds up an old note while a fresher note rides a conveyor toward the desk.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b{font:18px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
.lab{font:bold 12px "Courier New",monospace}
.slide{animation:sl 5s ease-in-out infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@keyframes sl{0%{transform:translateX(-70px)}60%,100%{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="600" height="340" fill="#efe6cc"/><rect width="600" height="340" fill="url(#dots)" opacity=".22"/><g transform="translate(430 215) scale(2.6)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/></g><g transform="translate(430 130) scale(1.4)"><use href="#wb" style="color:#efae78"/><text x="0" y="12" class="w-s" text-anchor="middle">reader</text></g><g transform="translate(430 52)"><rect x="-29" y="-11" width="58" height="22" rx="2" fill="#f7d79b" stroke="#322e24" stroke-width="2"/><text x="0" y="4" class="lab" text-anchor="middle">old</text></g><path d="M416 62L404 100M444 62L456 100" stroke="#322e24" stroke-width="3"/><rect x="30" y="238" width="250" height="16" rx="8" fill="#8e8672" stroke="#322e24" stroke-width="3"/><circle cx="52" cy="246" r="4" fill="#f7d79b" stroke="#322e24" stroke-width="1.5"/><circle cx="88" cy="246" r="4" fill="#f7d79b" stroke="#322e24" stroke-width="1.5"/><circle cx="124" cy="246" r="4" fill="#f7d79b" stroke="#322e24" stroke-width="1.5"/><circle cx="160" cy="246" r="4" fill="#f7d79b" stroke="#322e24" stroke-width="1.5"/><circle cx="196" cy="246" r="4" fill="#f7d79b" stroke="#322e24" stroke-width="1.5"/><circle cx="232" cy="246" r="4" fill="#f7d79b" stroke="#322e24" stroke-width="1.5"/><circle cx="268" cy="246" r="4" fill="#f7d79b" stroke="#322e24" stroke-width="1.5"/><path d="M50 262v14M260 262v14" stroke="#322e24" stroke-width="4"/><g class="slide"><rect x="186" y="207" width="58" height="22" rx="2" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><text x="215" y="222" class="lab" text-anchor="middle">new</text></g><path d="M120 205H310" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><text x="440" y="275" class="b" text-anchor="middle" style="fill:#a13324">stale: still the old note</text><text x="155" y="190" class="b" text-anchor="middle">on its way</text><rect x="10" y="288" width="580" height="44" fill="#fbf3dc" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="317" class="b" text-anchor="middle">The fresher note is still travelling.</text><text x="22" y="28" class="lab" text-anchor="start" style="fill:#a13324">DISTRIBUTED SYSTEMS</text><path d="M8 10Q300 5 592 9Q596 170 591 332Q300 336 9 331Q4 170 8 10Z" fill="none" stroke="#322e24" stroke-width="3.5" stroke-linejoin="round"/></svg>
