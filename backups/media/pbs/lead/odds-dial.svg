<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>Three desks around a ring and a big dial pointing near the likely end.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b{font:18px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.lab{font:bold 12px "Courier New",monospace}
.needle{transform-box:view-box;animation:nd 5s ease-out infinite}
@keyframes nd{0%{transform:rotate(-55deg)}60%,100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="600" height="340" fill="#e8e2cc"/><rect width="600" height="340" fill="url(#dots)" opacity=".22"/><ellipse cx="150" cy="170" rx="100" ry="82" fill="none" stroke="#322e24" stroke-width="3" stroke-dasharray="10 7"/><g transform="translate(150 90) scale(0.9)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/></g><g transform="translate(80 195) scale(0.9)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/></g><g transform="translate(225 195) scale(0.9)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/></g><path d="M315 230A125 125 0 0 1 565 230Z" fill="#fff8e3" stroke="#322e24" stroke-width="3" stroke-linejoin="round"/><path d="M324 230A116 116 0 0 1 440 114" fill="none" stroke="#f7d79b" stroke-width="8"/><path d="M440 114A116 116 0 0 1 556 230" fill="none" stroke="#a2c2a7" stroke-width="8"/><g class="needle" style="transform-origin:440px 230px"><path d="M440 230L530.6 159.2" stroke="#322e24" stroke-width="4" stroke-linecap="round"/></g><circle cx="440" cy="230" r="6" fill="#322e24"/><text x="377.5" y="248" class="lab" text-anchor="middle">unlikely</text><text x="502.5" y="248" class="lab" text-anchor="middle">likely</text><text x="440" y="78" class="b-s" text-anchor="middle">chance the read is fresh</text><text x="150" y="270" class="b-s" text-anchor="middle">three copies</text><rect x="10" y="288" width="580" height="44" fill="#fbf3dc" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><text x="300" y="317" class="b" text-anchor="middle">Not a promise. An odds estimate.</text><text x="22" y="28" class="lab" text-anchor="start" style="fill:#a13324">FROM THE PAPER · MODEL PREDICTION</text><path d="M8 10Q300 5 592 9Q596 170 591 332Q300 336 9 331Q4 170 8 10Z" fill="none" stroke="#322e24" stroke-width="3.5" stroke-linejoin="round"/></svg>
