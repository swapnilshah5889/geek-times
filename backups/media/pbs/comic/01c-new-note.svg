<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A helper holds up a new note and three arrows carry copies to the desks.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
.lab{font:bold 12px "Courier New",monospace}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#efe6cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(160 50) scale(1)"><use href="#wb" style="color:#c3b2d8"/><text x="0" y="12" class="w-s" text-anchor="middle">helper</text></g><rect x="131" y="4" width="58" height="22" rx="2" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><text x="160" y="19" class="lab" text-anchor="middle">new</text><path d="M120 88Q60 100 60 128" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><path d="M160 88Q160 100 160 128" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><path d="M200 88Q260 100 260 128" fill="none" stroke="#a1