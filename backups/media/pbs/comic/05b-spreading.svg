<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>The new note passes from desk to desk until every desk has it.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b{font:18px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.lab{font:bold 12px "Courier New",monospace}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(45 120) scale(1)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/><rect x="-22" y="-30" width="44" height="22" rx="2" fill="#a2c2a7" stroke-width="2"/><text x="0" y="-15" class="lab" text-anchor="middle" style="stroke:none">new</text></g><g transform="translate(125 120) scale(1)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/><rect x="-22" y="-30" width="44" height="22" rx="2" fill="#a2c2a7" stroke-width="2"/><text x="0" y="-15" class="lab" text-anchor="middle" style="stroke:none">new</text></g><g transform="translate(205 120) scale(1)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/><rect x="-22" y="-30" width="44" height="22" rx="2" fill="#a2c2a7" stroke-width="2"/><text x="0" y="-15" class="lab" text-anchor="middle" style="stroke:none">new</text></g><g transform="translate(285 120) scale(1)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/><rect x="-22" y="-30" width="44" height="22" rx="2" fill="#a2c2a7" stroke-width="2"/><text x="0" y="-15" class="lab" text-anchor="middle" style="stroke:none">new</text></g><path d="M73 130H97" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)"/><path d="M153 130H177" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)"/><path d="M233 130H257" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" marker-end="url(#ah)"/><text x="160" y="50" class="b" text-anchor="middle">the note keeps spreading</text><text x="160" y="190" class="b-s" text-anchor="middle">soon every desk has it</text></svg>
