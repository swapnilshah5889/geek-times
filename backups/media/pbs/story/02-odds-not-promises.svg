<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>Two dials, versions old and time to wait, each pointing at a likely zone.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b{font:18px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.lab{font:bold 12px "Courier New",monospace}
.needle{transform-box:view-box;animation:nd 5s ease-out infinite}
@keyframes nd{0%{transform:rotate(-55deg)}60%,100%{transform:rotate(0)}}
