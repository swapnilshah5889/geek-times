stroke="#a2c2a7" stroke-width="8"/><g class="needle" style="transform-origin:325px 130px"><path d="M325 130L373.2 72.5" stroke="#322e24" stroke-width="4" stroke-linecap="round"/></g><circle cx="325" cy="130" r="6" fill="#322e24"/><text x="282.5" y="148" class="lab" text-anchor="middle">unlikely</text><text x="367.5" y="148" class="lab" text-anchor="middle">likely</text><text x="115" y="185" class="b" text-anchor="middle">versions old</text><text x="325" y="185" class="b" text-anchor="middle">time to wait</text><text x="220" y="24" class="w" text-anchor="middle">odds, not promises</text></svg>
