<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>A write note and a read question race along four paths between a coordinator desk and a replica desk.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="440" height="215" fill="#eee5cb"/><rect width="440" height="215" fill="url(#dots)" opacity=".22"/><g transform="translate(50 110) scale(1.3)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/></g><text x="50" y="160" class="b-s" text-anchor="middle">helper</text><g transform="translate(390 110) scale(1.3)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v16M18 6v16" fill="none" stroke-width="3"/><rect x="-26" y="-6" width="52" height="13" rx="3" fill="#d9b98a"/></g><text x="390" y="160" class="b-s" text-anchor="middle">a desk</text><path d="M100 50H336" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><text x="218" y="44" class="b-s" text-anchor="middle">W: write goes out</text><path d="M336 90H100" fill="none" stroke="#377675" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><text x="218" y="84" class="b-s" text-anchor="middle">A: ack comes back</text><path d="M100 130H336" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><text x="218" y="124" class="b-s" text-anchor="middle">R: read goes out</text><path d="M336 170H100" fill="none" stroke="#377675" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" class="m-flow" marker-end="url(#ah)"/><text x="218" y="164" class="b-s" text-anchor="middle">S: answer comes back</text></svg>
