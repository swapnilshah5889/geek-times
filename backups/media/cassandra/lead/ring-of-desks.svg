<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>Six calm desks sit around a ring. Each catches some envelopes and writes them in a notebook.</title><style>text{fill:#28261e;font:17px Georgia,serif}
