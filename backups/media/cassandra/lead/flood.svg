<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>A flood of envelopes pours toward one small filing cabinet that is about to burst.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b{font:18px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
.sfx,.sfx-s{font:italic 900 30px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke;letter-spacing:-.02em}
.sfx-s{font-size:22px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
.m-shake{animation:m-shake 2.6s ease-in-out infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@keyframes m-shake{0%,80%,100%{transform:none}84%{transform:translateX(-3px)}88%{transform:translateX(3px)}92%{transform:translateX(-2px)}}
