<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A desk watches a silent neighbor while a meter needle slowly rises.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
.mono-s{font:bold 14px 'Courier New',monospace}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.needle{transform-box:view-box;animation:nd 5s ease-out infinite}
@keyframes nd{0%{transform:rotate(-55deg)}60%,100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(46 160) scale(1.2)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none" stroke-width="3"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="#d9b98a"/><rect x="-10" y="-16" width="20" height="10" rx="1.5" fill="#fff8e3" stroke-width="2"/><path d="M-6 -11h12" stroke-width="1.5" opacity=".5" fill="none"/></g><g transform="translate(46 112) scale(0.6)"><use href="#wb" style="color:#a2c2a7"/><text x="0" y="12" class="w" text-anchor="middle">me</text></g><g transform="translate(274 160) scale(1.2)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none" stroke-width="3"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="#8a867a"/><rect x="-10" y="-16" width="20" height="10" rx="1.5" fill="#fff8e3" stroke-width="2"/><path d="M-6 -11h12" stroke-width="1.5" opacity=".5" fill="none"/></g><text x="274" y="130" class="mono-s" text-anchor="middle">z z z</text><text x="274" y="205" class="b-s" text-anchor="middle">silent</text><path d="M98 160A62 62 0 0 1 222 160Z" fill="#fff8e3" stroke="#322e24" stroke-width="3" stroke-linejoin="round"/><path d="M106 160A54 54 0 0 1 160 106" fill="none" stroke="#a2c2a7" stroke-width="7"/><path d="M160 106A54 54 0 0 1 214 160" fill="none" stroke="#f7d79b" stroke-width="7"/><path d="M185.2 124.0L197.3 106.8" stroke="#a13324" stroke-width="4.5" stroke-linecap="round"/><g class="needle" style="transform-origin:160px 160px"><path d="M160 160L130.2 117.4" stroke="#322e24" stroke-width="4" stroke-linecap="round"/></g><circle cx="160" cy="160" r="6" fill="#322e24"/><text x="160" y="190" class="micro" text-anchor="middle">WORRY METER</text><text x="160" y="40" class="b-s" text-anchor="middle">quiet for a while...</text><path d="M70 150Q110 120 160 110" fill="none" stroke="#322e24" stroke-width="2" stroke-dasharray="4 5" opacity="0"/></svg>
