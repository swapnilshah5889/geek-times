<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>The whiteboard pours its notes into a neat folder; the board is now blank.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
.sfx,.sfx-s{font:italic 900 30px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke;letter-spacing:-.02em}
.sfx-s{font-size:22px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-wiggle{animation:m-wiggle 1.4s ease-in-out infinite}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-wiggle{0%,60%,100%{transform:none}70%{transform:rotate(-8deg)}80%{transform:rotate(8deg)}90%{transform:rotate(-4deg)}}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect x="26" y="50" width="120" height="84" rx="5" fill="#fbfaf0" stroke="#322e24" stroke-width="3"/><path d="M40 146L46 134M132 146L126 134" stroke="#322e24" stroke-width="3"/><path d="M44 74q22 -10 46 0t30 12M48 102q24 -8 50 2" fill="none" stroke="#d8cfb8" stroke-width="5" stroke-linecap="round"/><text x="86" y="36" class="micro" text-anchor="middle">NOW BLANK</text><path d="M150 92H206" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><g transform="translate(246 92) rotate(0)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"><path d="M-40.0 -25.0V-31.0Q-40.0 -35.0 -36.0 -35.0H-22.0L-16.0 -29.0H40.0V-25.0Z" fill="#a2c2a7" opacity=".85"/><rect x="-40.0" y="-26.0" width="80" height="57" rx="3" fill="#a2c2a7"/><path d="M-32.0 19.0h40" stroke-width="1.8" opacity=".5" fill="none"/></g><path d="M222 96h48M222 110h48M222 124h48" stroke="#322e24" stroke-width="2" opacity=".45"/><g class="m-wiggle"><text x="196" y="40" class="sfx-s" text-anchor="middle">FLUSH!</text></g><text x="246" y="150" class="micro" text-anchor="middle">SORTED FOLDER</text><text x="160" y="196" class="b-s" text-anchor="middle">never changed after this</text></svg>
