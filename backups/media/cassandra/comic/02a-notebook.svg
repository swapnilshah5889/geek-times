<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A pencil adds a line at the bottom of a long notebook.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-bob{to{transform:translateY(-7px)}}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(110 112) scale(1.45)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><rect x="-32" y="-42" width="64" height="84" rx="4" fill="#fff8e3"/><path d="M-32 -42v84" stroke="#a13324" stroke-width="3"/><path d="M-22 -28h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 -14h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 0h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 14h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 28h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 42h42" stroke-width="1.8" opacity=".55" fill="none"/></g><path d="M80 184h60" stroke="#322e24" stroke-width="2" stroke-dasharray="3 4" opacity=".7"/><path d="M82 168h56" stroke="#a13324" stroke-width="3" stroke-linecap="round" class="m-flow"/><g class="m-bob"><g transform="translate(172 168) rotate(-36)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="0" y="-5" width="34" height="10" fill="#efae78"/><path d="M0 -5L-12 0L0 5Z" fill="#f7d79b"/><path d="M-12 0l-3 0" stroke-width="3"/><rect x="34" y="-5" width="7" height="10" fill="#d98b8b"/></g></g><text x="250" y="100" class="micro" text-anchor="middle" style="fill:#a13324">NEW LINE</text><text x="250" y="120" class="b-s" text-anchor="middle">at the end</text><text x="250" y="138" class="b-s" text-anchor="middle">of the notebook</text></svg>
