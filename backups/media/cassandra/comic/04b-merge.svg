rx="4" fill="#ffe597" stroke="#322e24" stroke-width="2.5"/></g><g class="m-pulse"><text x="160" y="190" class="sfx" text-anchor="middle">ZIP!</text></g><text x="160" y="28" class="b-s" text-anchor="middle">two similar folders</text></svg>
