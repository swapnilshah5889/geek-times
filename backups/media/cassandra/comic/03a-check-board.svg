<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A magnifying glass looks over the whiteboard.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-scan{animation:m-scan 3s ease-in-out infinite alternate}
@keyframes m-scan{to{transform:translateX(84px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect x="60" y="62" width="200" height="100" rx="5" fill="#fbfaf0" stroke="#322e24" stroke-width="3"/><path d="M74 174L80 162M246 174L240 162" stroke="#322e24" stroke-width="3"/><rect x="70" y="72" width="57" height="24" fill="#f7d79b" stroke="#322e24" stroke-width="1.8"/><path d="M75 81h47M75 88h14" stroke="#322e24" stroke-width="1.5" opacity=".6"/><rect x="130" y="72" width="57" height="24" fill="#a2c2a7" stroke="#322e24" stroke-width="1.8"/><path d="M135 81h47M135 88h14" stroke="#322e24" stroke-width="1.5" opacity=".6"/><rect x="190" y="72" width="57" height="24" fill="#c3b2d8" stroke="#322e24" stroke-width="1.8"/><path d="M195 81h47M195 88h14" stroke="#322e24" stroke-width="1.5" opacity=".6"/><g class="m-scan"><g transform="translate(98 100) scale(1)" stroke="#322e24" stroke-width="4" stroke-linecap="round"><circle r="26" fill="#e8f3f0" fill-opacity=".45"/><path d="M19 19L46 46" stroke-width="8"/></g></g><text x="160" y="36" class="micro" text-anchor="middle">CHECK THE BOARD FIRST</text><text x="160" y="200" class="b-s" text-anchor="middle">newest notes live here</text></svg>
