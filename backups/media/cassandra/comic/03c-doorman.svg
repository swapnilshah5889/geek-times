<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A small doorman in front of a folder holds up a hand; the search skips to the next folder.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-bob{to{transform:translateY(-7px)}}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(95 100) rotate(0)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"><path d="M-44.0 -30.0V-36.0Q-44.0 -40.0 -40.0 -40.0H-26.0L-20.0 -34.0H44.0V-30.0Z" fill="#f7d79b" opacity=".85"/><rect x="-44.0" y="-31.0" width="88" height="67" rx="3" fill="#f7d79b"/><path d="M-36.0 24.0h44" stroke-width="1.8" opacity=".5" fill="none"/></g><g transform="translate(250 100) rotate(0)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"><path d="M-44.0 -30.0V-36.0Q-44.0 -40.0 -40.0 -40.0H-26.0L-20.0 -34.0H44.0V-30.0Z" fill="#a2c2a7" opacity=".85"/><rect x="-44.0" y="-31.0" width="88" height="67" rx="3" fill="#a2c2a7"/><path d="M-36.0 24.0h44" stroke-width="1.8" opacity=".5" fill="none"/></g><g class="m-bob"><g transform="translate(95 150) scale(0.8)"><use href="#wb" style="color:#c3b2d8"/><text x="0" y="12" class="w" text-anchor="middle">door</text></g></g><path d="M72 126l-12 -22" stroke="#322e24" stroke-width="2" stroke-linecap="round"/><circle cx="58" cy="100" r="6" fill="#f0c9a0" stroke="#322e24" stroke-width="2"/><rect x="14" y="8" width="100" height="34" rx="16" fill="#fff8e3" stroke="#322e24" stroke-width="2"/><path d="M75 40L84 60L93 40" fill="#fff8e3" stroke="#322e24" stroke-width="2" stroke-linejoin="round"/><text x="64.0" y="31" class="b-s" text-anchor="middle">Not here!</text><path d="M126 78Q172 50 214 76" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><text x="170" y="40" class="w-s" text-anchor="middle">skip</text><text x="160" y="206" class="b-s" text-anchor="middle">a tiny doorman per folder</text></svg>
