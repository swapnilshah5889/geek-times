<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A cursor clicks a search box while a cabinet slides its drawers forward, ready.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
.sfx,.sfx-s{font:italic 900 30px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke;letter-spacing:-.02em}
.sfx-s{font-size:22px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-pulse{animation:m-pulse 1.8s ease-in-out infinite}
.slide{animation:sl 5s ease-in-out infinite}
@keyframes m-pulse{50%{transform:scale(1.1)}}
@keyframes sl{0%{transform:translateX(-26px)}40%,100%{transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect x="30" y="20" width="170" height="34" rx="17" fill="#fff8e3" stroke="#322e24" stroke-width="3"/><circle cx="52" cy="37" r="7" fill="none" stroke="#322e24" stroke-width="2.5"/><path d="M57 42l6 6" stroke="#322e24" stroke-width="2.5"/><g transform="translate(212 40)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><path d="M0 0L0 22L6 17L10 26L14 24L10 16L18 16Z" fill="#fff8e3"/></g><g class="slide"><rect x="75.0" y="84" width="150" height="34" rx="4" fill="#b5ab92" stroke="#322e24" stroke-width="3"/><text x="150" y="107.0" class="w-s" text-anchor="middle">pizza</text><rect x="75.0" y="122" width="150" height="34" rx="4" fill="#b5ab92" stroke="#322e24" stroke-width="3"/><text x="150" y="145.0" class="w-s" text-anchor="middle">movie</text><rect x="75.0" y="160" width="150" height="34" rx="4" fill="#b5ab92" stroke="#322e24" stroke-width="3"/><text x="150" y="183.0" class="w-s" text-anchor="middle">trip</text></g><g class="m-pulse"><text x="260" y="90" class="sfx-s" text-anchor="middle">READY!</text></g><text x="160" y="212" class="b-s" text-anchor="middle">warmed up while you type</text></svg>
