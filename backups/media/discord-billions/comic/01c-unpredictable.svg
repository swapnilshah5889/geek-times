<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A worry meter swinging low and high. A worker shrugs by a box labeled new database.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b{font:18px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.needle{transform-box:view-box;animation:nd 5s ease-out infinite}
@keyframes nd{0%{transform:rotate(-55deg)}60%,100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#c3b2d8"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><path d="M40 120A70 70 0 0 1 180 120Z" fill="#fff8e3" stroke="#322e24" stroke-width="3" stroke-linejoin="round"/><path d="M48 120A62 62 0 0 1 110 58" fill="none" stroke="#a2c2a7" stroke-width="7"/><path d="M110 58A62 62 0 0 1 172 120" fill="none" stroke="#f7d79b" stroke-width="7"/><path d="M139.8 77.4L151.9 60.2" stroke="#a13324" stroke-width="4.5" stroke-linecap="round"/><g class="needle" style="transform-origin:110px 120px"><path d="M110 120L157.3 83.1" stroke="#322e24" stroke-width="4" stroke-linecap="round"/></g><circle cx="110" cy="120" r="6" fill="#322e24"/><path d="M110 120L55 85" stroke="#322e24" stroke-width="3" opacity=".25" stroke-linecap="round"/><text x="110" y="150" class="b" text-anchor="middle">speed? who knows</text><g stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M205 120l30 -14l50 0l-20 14z" fill="#e4c898"/><rect x="205" y="120" width="60" height="50" fill="#d9b98a"/><path d="M265 120l20 -14v50l-20 14z" fill="#c6a375"/></g><text x="235" y="150" class="micro" text-anchor="middle" style="fill:#322e24">new</text><text x="235" y="163" class="micro" text-anchor="middle" style="fill:#322e24">database</text><g transform="translate(250 200) scale(0.7)"><use href="#wb" style="color:#a2c2a7"/><text x="0" y="12" class="w" text-anchor="middle">meh</text></g></svg>
