<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A worker spots a half-empty slip, shakes his head and drops it in a bin.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b{font:18px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#c9d9c8"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(90 140) scale(1.1)"><use href="#wb" style="color:#efae78"/><text x="0" y="12" class="w" text-anchor="middle">no</text></g><g transform="translate(160 90) rotate(-12)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><rect x="-17.0" y="-22.0" width="34" height="44" rx="2" fill="#fff8e3"/><rect x="-13.0" y="-18.0" width="14" height="6" fill="#377675" stroke-width="1"/></g><path d="M150 100h18" stroke="#d8cfb8" stroke-width="5"/><g stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M222 118h56l-6 62h-44z" fill="#b5ab92"/><path d="M216 118h68" stroke-width="4"/></g><path d="M168 96Q195 70 250 104" fill="none" stroke="#a13324" stroke-width="3" stroke-dasharray="8 7" class="m-flow"/><text x="250" y="200" class="b" text-anchor="middle">broken? bin it</text></svg>
