<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>A ring of desks with notebooks, whiteboards and folders. A new bubble lands on one desk.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b{font:18px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
.m-hop{animation:m-hop 2.4s ease-in-out infinite}
@keyframes m-bob{to{transform:translateY(-7px)}}
@keyframes m-hop{0%,40%,100%{transform:none}20%{transform:translateY(-14px)}}
