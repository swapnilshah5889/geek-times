<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>A fast road with a closed gate beside a long winding road, with cars turning onto the winding one.</title><style>text{fill:#28261e;font:17px Georgia,serif}
