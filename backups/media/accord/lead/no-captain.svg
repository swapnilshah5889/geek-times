<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>Six desks on a ring, no hats; three people walk to their nearest desk; a clock in the middle.</title><style>text{fill:#28261e;font:17px Georgia,serif}
