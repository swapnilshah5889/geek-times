<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A desk with a worry meter pointing high steps up and picks up the envelope.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.needle{transform-box:view-box;animation:nd 5s ease-out infinite}
@keyframes nd{0%{transform:rotate(-55deg)}60%,100%{transform:rotate(0)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#e8e2cc"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><path d="M38 100A52 52 0 0 1 142 100Z" fill="#fff8e3" stroke="#322e24" stroke-width="3" stroke-linejoin="round"/><path d="M46 100A44 44 0 0 1 90 56" fill="none" stroke="#a2c2a7" stroke-width="7"/><path d="M90 56A44 44 0 0 1 134 100" fill="none" stroke="#f7d79b" stroke-width="7"/><path d="M109.5 72.1L121.5 54.9" stroke="#a13324" stroke-width="4.5" stroke-linecap="round"/><g class="needle" style="transform-origin:90px 100px"><path d="M90 100L122.2 73.0" stroke="#322e24" stroke-width="4" stroke-linecap="round"/></g><circle cx="90" cy="100" r="6" fill="#322e24"/><text x="90" y="124" class="micro" text-anchor="middle">worry meter</text><g transform="translate(190 130) scale(1.3)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none" stroke-width="3"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="#d9b98a"/><rect x="-10" y="-16" width="20" height="10" rx="1.5" fill="#fff8e3" stroke-width="2"/><path d="M-6 -11h12" stroke-width="1.5" opacity=".5" fill="none"/></g><g transform="translate(190 74)" stroke="#322e24" stroke-width="2"><circle r="13" fill="#f0c9a0"/><path d="M-13 -1Q-13 -16 0 -15Q13 -16 13 -1Q4 -6 -13 -1Z" fill="#5a3a28"/><circle cx="-4" cy="1" r="1.3" fill="#322e24" stroke="none"/><circle cx="4" cy="1" r="1.3" fill="#322e24" stroke="none"/><path d="M-4 5q4 3 8 0" fill="none"/></g><g transform="translate(235 120) rotate(-8) scale(1.3)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-9" width="26" height="18" rx="2" fill="#f7d79b"/><path d="M-13 -9L0 2L13 -9" fill="none"/></g><text x="160" y="200" class="b-s" text-anchor="middle">a desk that saw the job steps up</text><text x="250" y="60" class="b-s" text-anchor="middle" style="font-style:italic">I’ll do it</text></svg>
