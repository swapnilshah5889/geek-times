@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><path d="M24 60h12M24 54v12M36 54v12" stroke="#a13324" stroke-width="3" stroke-linecap="round"/><text x="60" y="84" class="b-s" text-anchor="middle">tiny clock gap</text><rect x="12" y="110" width="296" height="40" fill="#a9c4d4" stroke="#322e24" stroke-width="3"/><path d="M30 124q12 -10 24 0t24 0" fill="none" stroke="#f6f0df" stroke-width="3"/><path d="M76 124q12 -10 24 0t24 0" fill="none" stroke="#f6f0df" stroke-width="3"/><path d="M122 124q12 -10 24 0t24 0" fill="none" stroke="#f6f0df" stroke-width="3"/><path d="M168 124q12 -10 24 0t24 0" fill="none" stroke="#f6f0df" stroke-width="3"/><path d="M214 124q12 -10 24 0t24 0" fill="none" stroke="#f6f0df" stroke-width="3"/><path d="M260 124q12 -10 24 0t24 0" fill="none" stroke="#f6f0df" stroke-width="3"/><path d="M12 106H308" stroke="#322e24" stroke-width="5" stroke-dasharray="14 8"/><path d="M60 98H280" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round"  marker-end="url(#ah)"/><text x="160" y="176" class="b-s" text-anchor="middle">a long trip across the ocean</text><text x="160" y="200" class="b-s" text-anchor="middle">the gap is small beside it</text><text x="160.0" y="216" class="micro" text-anchor="middle" style="fill:#a13324">Argued by the paper · not a test</text></svg>
