<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>The desk checks notes from two neighbours and stamps the envelope done.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.sfx,.sfx-s{font:italic 900 30px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke;letter-spacing:-.02em}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-pulse{animation:m-pulse 1.8s ease-in-out infinite}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-pulse{50%{transform:scale(1.1)}}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(160 140) scale(1.4)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none" stroke-width="3"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="#d9b98a"/><rect x="-10" y="-16" width="20" height="10" rx="1.5" fill="#fff8e3" stroke-width="2"/><path d="M-6 -11h12" stroke-width="1.5" opacity=".5" fill="none"/></g><g transform="translate(160 96) rotate(0) scale(1.5)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-9" width="26" height="18" rx="2" fill="#f7d79b"/><path d="M-13 -9L0 2L13 -9" fill="none"/></g><g transform="translate(52 90) scale(0.6)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><rect x="-32" y="-42" width="64" height="84" rx="4" fill="#fff8e3"/><path d="M-32 -42v84" stroke="#a13324" stroke-width="3"/><path d="M-22 -28h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 -14h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 0h42" stroke-width="1.8" opacity=".55" fill="none"/></g><g transform="translate(268 90) scale(0.6)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><rect x="-32" y="-42" width="64" height="84" rx="4" fill="#fff8e3"/><path d="M-32 -42v84" stroke="#a13324" stroke-width="3"/><path d="M-22 -28h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 -14h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 0h42" stroke-width="1.8" opacity=".55" fill="none"/></g><path d="M86 90Q120 80 138 94" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><path d="M234 90Q200 80 182 94" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><g class="m-pulse"><text x="160" y="60" class="sfx" text-anchor="middle">DONE!</text></g><text x="160" y="200" class="b-s" text-anchor="middle">checks two neighbours’ notes, then stamps it</text></svg>
