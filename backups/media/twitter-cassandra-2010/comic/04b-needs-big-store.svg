<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A bridge labeled new project cannot be finished until a big store plank is laid.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b{font:18px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
@keyframes m-bob{to{transform:translateY(-7px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#e9d9bd"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect y="185" width="320" height="35" fill="#e3d4b0"/><path d="M0 185H320" stroke="#322e24" stroke-width="2.5"/><path d="M20 120h90M210 120h90" stroke="#322e24" stroke-width="8"/><path d="M20 130h90M210 130h90" stroke="#322e24" stroke-width="3" opacity=".5"/><g class="m-bob"><rect x="110" y="112" width="100" height="14" fill="#d9b98a" stroke="#322e24" stroke-width="2.5" stroke-dasharray="8 6"/></g><text x="160" y="100" class="b-s" text-anchor="middle">new project</text><text x="160" y="160" class="b-s" text-anchor="middle">big data store plank</text><text x="160" y="30" class="b" text-anchor="middle">needs a big store</text><text x="160" y="208" class="micro" text-anchor="middle" style="fill:#a13324">ILLUSTRATION</text></svg>
