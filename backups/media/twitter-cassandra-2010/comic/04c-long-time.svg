<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A small plant labeled Cassandra gets watered and has a taller shadow.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b{font:18px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
