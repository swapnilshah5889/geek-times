<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>Reversed web addresses sit in alphabetical order, same-site rows together</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b{font:18px Georgia,serif}
.b-s{font:15px Georgia,serif}
.mono-s{font:bold 14px 'Courier New',monospace}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#f6f0df"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><text x="160" y="28" class="w" text-anchor="middle">rows sorted a-z</text><rect x="40" y="46" width="190" height="30" rx="3" fill="#fff8e3" stroke="#322e24" stroke-width="2"/><text x="52" y="67" class="mono-s" text-anchor="start">com.bbc.www</text><rect x="40" y="80" width="190" height="30" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><text x="52" y="101" class="mono-s" text-anchor="start">com.cnn.www/a</text><rect x="40" y="114" width="190" height="30" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><text x="52" y="135" class="mono-s" text-anchor="start">com.cnn.www/b</text><rect x="40" y="148" width="190" height="30" rx="3" fill="#fff8e3" stroke="#322e24" stroke-width="2"/><text x="52" y="169" class="mono-s" text-anchor="start">org.acm.www</text><path d="M240 52q14 0 14 14v34q0 14 -14 14" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="1" /><text x="262" y="82" class="b-s" text-anchor="start">same site,</text><text x="262" y="100" class="b-s" text-anchor="start">side by</text><text x="262" y="118" class="b-s" text-anchor="start">side</text><text x="160" y="204" class="b-s" text-anchor="middle">web addresses are written backwards</text></svg>
