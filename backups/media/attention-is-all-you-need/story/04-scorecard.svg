<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>Previous best 26.36 BLEU points. Large Transformer 28.4 points on the same English-to-German translation test.</title><style>text{fill:#28261e;font:17px Georgia,serif}.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}.strong{font:bold 20px Georgia,serif}
.post{animation:handoff 5.5s linear infinite}.direct{stroke-dasharray:6 8;animation:trace 1.5s linear infinite}
.typed{animation:printword 6s infinite;opacity:0}.typed.two{animation-name:secondword}.typed.three{animation-name:thirdword}
@keyframes handoff{0%,10%{transform:translate(0,0)}23%,32%{transform:translate(96px,0)}45%,55%{transform:translate(192px,0)}70%,100%{transform:translate(288px,0)}}
@keyframes printword{0%,8%{opacity:0}15%,100%{opacity:1}}@keyframes secondword{0%,32%{opacity:0}40%,100%{opacity:1}}@keyframes thirdword{0%,58%{opacity:0}66%,100%{opacity:1}}
@keyframes trace{to{stroke-dashoffset:-30}}
@media(prefers-reduced-motion:reduce){.typed{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern></defs><rect width="440" height="215" fill="#f0e3c6"/><rect width="440" height="215" fill="url(#dots)" opacity=".27"/><text x="220" y="24" class="micro" text-anchor="middle">ENGLISH → GERMAN  /  2014 TEST SET</text><text x="33" y="53" class="" text-anchor="start">Previous best</text><rect x="34" y="61" width="330" height="15" fill="#ddcfb0"/><rect x="34" y="61" width="289.96" height="15" fill="#a27c55"/><text x="408" y="75" class="strong" text-anchor="end">26.36</text><text x="33" y="115" class="" text-anchor="start">Large Transformer</text><rect x="34" y="123" width="330" height="15" fill="#ddcfb0"/><rect x="34" y="123" width="312.4" height="15" fill="#377675"/><text x="408" y="137" class="strong" text-anchor="end">28.4</text><path d="M34 158H364" stroke="#51493c"/><text x="34" y="178" class="" text-anchor="middle">0</text><text x="199" y="178" class="" text-anchor="middle">15</text><text x="364" y="178" class="" text-anchor="middle">30</text><text x="220" y="201" class="micro" text-anchor="middle">BLEU POINTS · HIGHER IS BETTER</text></svg>
