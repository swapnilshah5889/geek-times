<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>A baseball bat swings at a ball on a sunny field.</title><style>text{font-family:Georgia,serif}.tiny{font:bold 12px 'Courier New',monospace;letter-spacing:2px}
.wing{animation:flap 1.2s ease-in-out infinite alternate;transform-origin:290px 145px}.flying{animation:drift 2.5s ease-in-out infinite alternate}
.ball{animation:pitch 2.8s ease-in-out infinite}.signal{stroke-dasharray:5 10;animation:trace 1.4s linear infinite}
@keyframes flap{to{transform:scaleY(.8)}}@keyframes drift{to{transform:translate(8px,-9px)}}
@keyframes pitch{0%,15%{transform:translate(-24px,26px)}80%,100%{transform:translate(31px,-19px)}}@keyframes trace{to{stroke-dashoffset:-30}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="stripes" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(25)"><path d="M0 0V8" stroke="#27251e" stroke-width="2" opacity=".25"/></pattern><g id="star" fill="#ffe597"><path d="M0 -8L2 -2 8 0 2 2 0 8 -2 2 -8 0 -2 -2Z"/></g></defs>
<g><rect width="600" height="340" fill="#ecc280"/><circle cx="174" cy="106" r="65" fill="#df7855"/><circle cx="174" cy="106" r="65" fill="url(#dots)"/><path d="M0 191Q176 135 332 174T600 161V340H0Z" fill="#84a68a"/><path d="M0 217Q167 159 331 199T600 181V340H0Z" fill="url(#stripes)"/><g transform="rotate(-35 287 148)" stroke="#28261e" stroke-width="3"><path d="M148 155Q140 147 147 139L207 140Q240 138 299 125L378 112Q401 110 406 127Q410 143 388 148L301 155Q251 160 209 154L151 160Z" fill="#e29b52"/><path d="M156 140l3 16m5 -16 3 15m5 -15 3 15m5 -15 3 15m5 -14 3 14" stroke="#784839"/><path d="M292 140Q349 128 385 125" fill="none" stroke="#fcdb94"/></g><g class="ball"><circle cx="421" cy="83" r="23" fill="#fff1cb" stroke="#27251e" stroke-width="2"/><path d="M407 65q24 13 24 37m-13 -40q-2 18 -18 29" fill="none" stroke="#ae4534" stroke-width="2" stroke-dasharray="3 2"/></g></g>
<rect x="14" y="14" width="145" height="23" fill="#f6f0df"/><text x="24" y="30" class="tiny" fill="#28261e">PLATE 02 / FIELD</text>
<rect x="0" y="238" width="600" height="102" fill="#efe5c9"/><path d="M0 238H600" stroke="#29261e" stroke-width="2"/><text x="300" y="283" text-anchor="middle" fill="#28261e" font-size="30">The bat hit the ball.</text><path d="M376 291Q310 323 233 291" fill="none" stroke="#a13324" class="signal" stroke-width="3"/><text x="300" y="327" text-anchor="middle" class="tiny" fill="#8d3226">FOLLOW THE CONTEXT CLUE</text></svg>
