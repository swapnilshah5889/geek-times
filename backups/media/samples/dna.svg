<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="400" height="250" role="img" aria-label="Sample art: A DNA double helix with scissors cutting it.">
<style>.sa-tag{font:bold 11px 'Courier New',monospace;letter-spacing:1.5px;fill:#28261e}
.sa-sfx{font:italic 900 26px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke}
.sa-spin{transform-box:view-box;transform-origin:200px 125px;animation:sa-spin 14s linear infinite}
.sa-pulse{transform-box:fill-box;transform-origin:center;animation:sa-pulse 2.4s ease-in-out infinite}
@keyframes sa-spin{to{transform:rotate(360deg)}}@keyframes sa-pulse{50%{transform:scale(1.15);opacity:.6}}
@media(prefers-reduced-motion:reduce){.sa-spin,.sa-pulse{animation:none}}</style>
<defs><pattern id="sa-dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"></circle></pattern></defs>
<rect width="400" height="250" fill="#e8d0c4"/>
<rect width="400" height="250" fill="url(#sa-dots)" opacity=".25"/>
<g fill="none" stroke-width="7" stroke-linecap="round">
<path d="M40 70C80 70 80 180 120 180S160 70 200 70S240 180 280 180S320 70 360 70" stroke="#a13324"></path>
<path d="M40 180C80 180 80 70 120 70S160 180 200 180S240 70 280 70S320 180 360 180" stroke="#377675"></path>
</g>
<g stroke="#322e24" stroke-width="3"><path d="M60 92V158M100 110V140M140 110V140M180 92V158M220 92V158M300 92V158M340 110V140"></path></g>
<g stroke="#322e24" stroke-width="6" stroke-linecap="round"><path d="M232 104L292 126"></path><path d="M232 146L292 124"></path></g>
<circle cx="222" cy="100" r="13" fill="#f6e3a1" stroke="#322e24" stroke-width="4"></circle><circle cx="222" cy="150" r="13" fill="#f6e3a1" stroke="#322e24" stroke-width="4"></circle>
<g class="sa-pulse"><text x="318" y="62" class="sa-sfx" text-anchor="middle">SNIP!</text></g>
<rect x="12" y="12" width="104" height="22" fill="#f6f0df" stroke="#322e24" stroke-width="1"/>
<text x="22" y="27" class="sa-tag">SAMPLE ART</text>
</svg>
