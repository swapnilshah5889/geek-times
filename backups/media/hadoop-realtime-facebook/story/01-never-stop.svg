<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>Envelopes from phones, laptops and chat bubbles pour toward small database cabinets</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-feed{animation:m-feed 4.5s ease-in-out infinite}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-feed{0%{transform:none;opacity:0}10%,45%{opacity:1}60%{transform:translateX(70px);opacity:0}100%{transform:translateX(70px);opacity:0}}
@keyframes m-flow{to{stroke-dashoffset:-36}}
