<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A pencil writes a new line at the bottom of a notebook</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
.m-meter{transform-origin:left center;animation:m-meter 6s ease-out infinite}
@keyframes m-bob{to{transform:translateY(-7px)}}
@keyframes m-meter{0%{transform:scaleX(0)}35%,100%{transform:scaleX(1)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(150 100) scale(2)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><rect x="-32" y="-42" width="64" height="84" rx="4" fill="#fff8e3"/><path d="M-32 -42v84" stroke="#a13324" stroke-width="3"/><path d="M-22 -28h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 -14h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 0h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 14h42" stroke-width="1.8" opacity=".55" fill="none"/><path d="M-22 28h42" stroke-width="1.8" opacity=".55" fill="none"/></g><path d="M116 148h48" stroke="#a13324" stroke-width="4" stroke-linecap="round" class="m-meter"/><g class="m-bob"><g transform="translate(150 160) rotate(-35)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="0" y="-5" width="34" height="10" fill="#efae78"/><path d="M0 -5L-12 0L0 5Z" fill="#f7d79b"/><path d="M-12 0l-3 0" stroke-width="3"/><rect x="34" y="-5" width="7" height="10" fill="#d98b8b"/></g></g><text x="250" y="80" class="w-s" text-anchor="middle">notebook</text><text x="250" y="100" class="b-s" text-anchor="middle">written first</text><text x="250" y="124" class="b-s" text-anchor="middle">a crash</text><text x="250" y="144" class="b-s" text-anchor="middle">cannot lose it</text></svg>
