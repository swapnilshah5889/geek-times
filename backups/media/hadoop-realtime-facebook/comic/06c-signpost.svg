<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A signpost swings its arrow from one desk to the other while a stopwatch ticks</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-wobble{animation:m-wobble 1.8s ease-in-out infinite alternate}
@keyframes m-wobble{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><path d="M160 60V190" stroke="#322e24" stroke-width="7" stroke-linecap="round"/><g class="m-wobble"><path d="M160 52h58l16 14 -16 14h-58Z" fill="#ffe597" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><rect x="14" y="140" width="76" height="30" rx="4" fill="#d4d0c4" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4"/><rect x="236" y="140" width="76" height="30" rx="4" fill="#d9b98a" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="52" y="192" class="b-s" text-anchor="middle">old boss</text><text x="274" y="192" class="b-s" text-anchor="middle">new boss</text><circle cx="62" cy="68" r="22" fill="#fff8e3" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><path d="M62 68V54M62 68l10 6M56 44h12" fill="none" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><text x="62" y="108" class="b-s" text-anchor="middle">quick</text></svg>
