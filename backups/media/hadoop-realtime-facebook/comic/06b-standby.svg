<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>Two bosses at two desks and the second reads along over the first</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern></defs><rect width="320" height="220" fill="#f7d79b"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect x="20" y="110" width="110" height="36" rx="4" fill="#d9b98a" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="190" y="110" width="110" height="36" rx="4" fill="#d9b98a" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(75 80) scale(0.9)"><use href="#wb" style="color:#efae78"/><text x="0" y="12" class="w" text-anchor="middle">boss</text></g><g transform="translate(245 80) scale(0.9)"><use href="#wb" style="color:#a2c2a7"/><text x="0" y="12" class="w-s" text-anchor="middle">standby</text></g><rect x="52" y="100" width="46" height="12" fill="#fff8e3" stroke="#322e24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M136 96Q160 70 190 92" fill="none" stroke="#a13324" stroke-width="3" stroke-dasharray="6 5" class="m-flow"/><text x="160" y="60" class="b-s" text-anchor="middle">same diary</text><text x="75" y="176" class="b-s" text-anchor="middle">writes the diary</text><text x="245" y="176" class="b-s" text-anchor="middle">reads along</text></svg>
