<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>Envelopes drop into a mailbox that keeps getting taller</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-feed{animation:m-feed 4.5s ease-in-out infinite}
@keyframes m-feed{0%{transform:none;opacity:0}10%,45%{opacity:1}60%{transform:translateX(70px);opacity:0}100%{transform:translateX(70px);opacity:0}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect x="120" y="150" width="80" height="28" rx="3" fill="#f7d79b" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="120" y="122" width="80" height="28" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="120" y="94" width="80" height="28" rx="3" fill="#c3b2d8" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="120" y="66" width="80" height="28" rx="3" fill="#efae78" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><rect x="110" y="30" width="100" height="14" rx="3" fill="#b5ab92" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><g transform="translate(160 22) rotate(-10) scale(1)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-9" width="26" height="18" rx="2" fill="#fff8e3"/><path d="M-13 -9L0 2L13 -9" fill="none"/></g><g class="m-feed"><g transform="translate(80 70) rotate(10) scale(1)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-9" width="26" height="18" rx="2" fill="#fff8e3"/><path d="M-13 -9L0 2L13 -9" fill="none"/></g></g><g transform="translate(250 60) rotate(14) scale(1)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="-13" y="-9" width="26" height="18" rx="2" fill="#fff8e3"/><path d="M-13 -9L0 2L13 -9" fill="none"/></g><path d="M260 160V70" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round"  marker-end="url(#ah)"/><text x="160" y="196" class="b-s" text-anchor="middle">every message is kept</text><text x="160" y="214" class="micro" text-anchor="middle" style="letter-spacing:0">taller and taller</text></svg>
