<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A block passes along a line of three machines</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-ride{animation:m-ride 8s ease-in-out infinite}
@keyframes m-ride{0%,6%{transform:translateY(140px)}14%,20%{transform:translateY(112px)}28%,34%{transform:translateY(84px)}42%,48%{transform:translateY(56px)}56%,62%{transform:translateY(28px)}70%,96%{transform:none}100%{transform:translateY(140px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect x="20" y="90" width="60" height="52" rx="6" fill="#f7d79b" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="40" cy="104" r="2.4" fill="#322e24"/><circle cx="60" cy="104" r="2.4" fill="#322e24"/><path d="M45 111q5 4 10 0" fill="none" stroke="#322e24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="130" y="90" width="60" height="52" rx="6" fill="#efae78" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="150" cy="104" r="2.4" fill="#322e24"/><circle cx="170" cy="104" r="2.4" fill="#322e24"/><path d="M155 111q5 4 10 0" fill="none" stroke="#322e24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><rect x="240" y="90" width="60" height="52" rx="6" fill="#c3b2d8" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/><circle cx="260" cy="104" r="2.4" fill="#322e24"/><circle cx="280" cy="104" r="2.4" fill="#322e24"/><path d="M265 111q5 4 10 0" fill="none" stroke="#322e24" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><path d="M82 112H128" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round"  marker-end="url(#ah)"/><path d="M192 112H238" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round"  marker-end="url(#ah)"/><g class="m-ride"><rect x="40" y="52" width="20" height="20" fill="#ffe597" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/></g><text x="160" y="36" class="b-s" text-anchor="middle">a block goes down the line</text><text x="160" y="190" class="b-s" text-anchor="middle">one write, every copy</text></svg>
