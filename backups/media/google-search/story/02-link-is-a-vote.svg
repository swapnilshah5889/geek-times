 -14h24" stroke="#322e24" stroke-width="1.8" stroke-linecap="round" opacity=".65"/><path d="M-12 -6h16" stroke="#322e24" stroke-width="1.8" stroke-linecap="round" opacity=".65"/><path d="M-12 2h24" stroke="#322e24" stroke-width="1.8" stroke-linecap="round" opacity=".65"/></g><g transform="translate(330 90) rotate(0) scale(1.5)"><path d="M-18 -24H8L18 -14V24H-18Z" fill="#f7d79b" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><path d="M8 -24V-14H18" fill="none" stroke="#322e24" stroke-width="2"/><path d="M-12 -14h24" stroke="#322e24" stroke-width="1.8" stroke-linecap="round" opacity=".65"/><path d="M-12 -6h16" stroke="#322e24" stroke-width="1.8" stroke-linecap="round" opacity=".65"/><path d="M-12 2h24" stroke="#322e24" stroke-width="1.8" stroke-linecap="round" opacity=".65"/></g><g class="m-twinkle"><use href="#mstar" transform="translate(330 36) scale(1.5)"/><use href="#mstar" transform="translate(304 46) scale(1.1)"/><use href="#mstar" transform="translate(356 46) scale(1.1)"/></g><text x="130" y="80" class="micro" text-anchor="middle">BIG</text><text x="396" y="148" class="b-s" text-anchor="end">top of the list</text><rect x="90" y="172" width="260" height="32" fill="#fbf3dc" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><text x="220" y="195" class="b-s" text-anchor="middle">Big votes and small votes.</text><path d="M4 6Q220 1 436 5Q440 108 435 210Q220 214 5 210Q1 108 4 6Z" fill="none" stroke="#322e24" stroke-width="3" stroke-linejoin="round"/></svg>
