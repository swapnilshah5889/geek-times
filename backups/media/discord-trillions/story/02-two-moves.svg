<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>Three warning signs and two fixes: a new desk and a front counter</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b{font:18px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}.k2{stroke:#322e24;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.k25{stroke:#322e24;stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
