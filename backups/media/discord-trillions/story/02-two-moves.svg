path d="M-9.0 -6.0h8" fill="none"/></g><g transform="translate(-2 1) rotate(0)" class="k2"><rect x="-12.0" y="-3.0" width="24" height="6" rx="2" fill="#c3b2d8"/><path d="M-9.0 -6.0h8" fill="none"/></g><g transform="translate(1 -4) rotate(0)" class="k2"><rect x="-12.0" y="-3.0" width="24" height="6" rx="2" fill="#efae78"/><path d="M-9.0 -6.0h8" fill="none"/></g></g><text x="50" y="132" class="b-s" text-anchor="middle">tidying late</text><g transform="translate(50 168)"><path d="M0 -22L24 18H-24Z" fill="#fff8e3" stroke="#a13324" stroke-width="4" stroke-linejoin="round"/><circle cx="0" cy="6" r="9" fill="#fff8e3" class="k25"/><path d="M0 6v-6M0 6l3 3" class="k2" fill="none"/></g><text x="50" y="200" class="b-s" text-anchor="middle">pauses</text><path d="M100 50Q170 30 250 44" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><path d="M104 120Q190 130 252 146" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><g transform="translate(300 76) scale(1.5)" class="k25"><path d="M-18 6v15M18 6v15" fill="none" stroke-width="3"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="#377675"/></g><g transform="translate(300 40)" class="k2"><circle r="12" fill="#f0c9a0"/><path d="M-12 -1Q-12 -15 0 -14Q12 -15 12 -1Q4 -6 -12 -1Z" fill="#27251e"/><circle cx="-4" cy="1" r="1.3" fill="#322e24" stroke="none"/><circle cx="4" cy="1" r="1.3" fill="#322e24" stroke="none"/><path d="M-4 5q4 3 8 0" fill="none"/></g><text x="300" y="116" class="b" text-anchor="middle">new desk</text><g transform="translate(372 148)"><rect x="-40" y="-8" width="80" height="34" rx="4" fill="#d9b98a" class="k25"/><rect x="-46" y="-16" width="92" height="10" rx="3" fill="#c79f6b" class="k25"/></g><text x="372" y="192" class="b" text-anchor="middle">front counter</text></svg>
