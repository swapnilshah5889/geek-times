<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A nearly full progress bar blocked by a pile of grey markers</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}.k2{stroke:#322e24;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.k3{stroke:#322e24;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#e6dcef"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><rect x="20" y="60" width="280" height="26" rx="13" fill="#fff8e3" class="k3"/><rect x="24" y="64" width="232" height="18" rx="9" fill="#a2c2a7"/><text x="160" y="50" class="w" text-anchor="middle">almost done</text><g transform="translate(262 160)" class="k2"><path d="M-9 20v-22a9 9 0 0 1 18 0v22Z" fill="#b5ab92"/><path d="M0 -4v10M-4 0h8" fill="none"/></g><g transform="translate(274 158)" class="k2"><path d="M-9 20v-22a9 9 0 0 1 18 0v22Z" fill="#b5ab92"/><path d="M0 -4v10M-4 0h8" fill="none"/></g><g transform="translate(286 156)" class="k2"><path d="M-9 20v-22a9 9 0 0 1 18 0v22Z" fill="#b5ab92"/><path d="M0 -4v10M-4 0h8" fill="none"/></g><g transform="translate(298 154)" class="k2"><path d="M-9 20v-22a9 9 0 0 1 18 0v22Z" fill="#b5ab92"/><path d="M0 -4v10M-4 0h8" fill="none"/></g><g transform="translate(40 178)" class="k2"><path d="M-9 20v-22a9 9 0 0 1 18 0v22Z" fill="#b5ab92"/></g><g transform="translate(70 178)" class="k2"><path d="M-9 20v-22a9 9 0 0 1 18 0v22Z" fill="#b5ab92"/></g><g transform="translate(100 178)" class="k2"><path d="M-9 20v-22a9 9 0 0 1 18 0v22Z" fill="#b5ab92"/></g><text x="160" y="128" class="b-s" text-anchor="middle">grey markers pile up at the end</text><path d="M236 100Q250 100 260 120" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/></svg>
