<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A person drops a note into both an old box and a new box</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.w-s{font:bold 15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-flow{to{stroke-dashoffset:-36}}.k18{stroke:#322e24;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.k2{stroke:#322e24;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.k3{stroke:#322e24;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><g id="wb" stroke="#322e24" stroke-width="2" stroke-linecap="round"><path d="M-14 25v10l-8 2M14 25v10l8 2M-34 2l-10-5M34 2l10-6" fill="none"/><rect x="-34" y="-25" width="68" height="50" rx="10" fill="currentColor"/><circle cx="-7" cy="-14" r="2" fill="#322e24" stroke="none"/><circle cx="7" cy="-14" r="2" fill="#322e24" stroke="none"/><path d="M-3 -9q3 3 6 0" fill="none"/></g><path id="mstar" d="M0 -10L3 -3 10 0 3 3 0 10 -3 3 -10 0 -3 -3Z" fill="#ffe597" stroke="#322e24" stroke-width="1"/><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern><pattern id="m-hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><path d="M0 0V7" stroke="#f6f0df" stroke-width="2" opacity=".3"/></pattern><pattern id="m-grid" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="3" height="3" fill="#377675"/></pattern><marker id="ah" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#a13324"/></marker></defs><rect width="320" height="220" fill="#f0e3c6"/><rect width="320" height="220" fill="url(#dots)" opacity=".22"/><g transform="translate(160 50) scale(1.2)"><rect x="-9" y="10" width="18" height="17" rx="6" fill="#b9603a" class="k2"/></g><g transform="translate(160 50)" class="k2"><circle r="13.2" fill="#f0c9a0"/><path d="M-13.2 -1Q-13.2 -16.2 0 -15.2Q13.2 -16.2 13.2 -1Q4 -6 -13.2 -1Z" fill="#27251e"/><circle cx="-4" cy="1" r="1.3" fill="#322e24" stroke="none"/><circle cx="4" cy="1" r="1.3" fill="#322e24" stroke="none"/><path d="M-4 5q4 3 8 0" fill="none"/></g><g transform="translate(160 98) rotate(0) scale(1.4)" class="k18"><rect x="-9" y="-7" width="18" height="14" fill="#ffe597"/><path d="M-5 -2h10M-5 3h6" fill="none" opacity=".6"/></g><rect x="40" y="130" width="90" height="56" rx="5" fill="#b5ab92" class="k3"/><text x="85" y="164" class="w-s" text-anchor="middle">old box</text><rect x="190" y="130" width="90" height="56" rx="5" fill="#377675" class="k3"/><text x="235" y="164" text-anchor="middle" class="w-s" style="fill:#fff8e3">new box</text><path d="M150 112Q110 110 98 126" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><path d="M170 112Q210 110 232 126" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><text x="160" y="20" class="w" text-anchor="middle">write to both</text></svg>
