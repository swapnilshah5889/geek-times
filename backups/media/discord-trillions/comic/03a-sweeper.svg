<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A tiny sweeper robot tidies a whiteboard while a worker writes</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-bob{animation:m-bob 1.6s ease-in-out infinite alternate}
@keyframes m-bob{to{transform:translateY(-7px)}}.k2{stroke:#322e24;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.k3{stroke:#322e24;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}.k4{stroke:#322e24;stroke-width:4;stroke-linejoin:round;stroke-linecap:round}
