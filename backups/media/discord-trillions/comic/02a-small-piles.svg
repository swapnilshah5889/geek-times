<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>Many small folders zipping into one neat folder</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
