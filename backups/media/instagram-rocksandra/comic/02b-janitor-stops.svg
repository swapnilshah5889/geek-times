8.0 104.5,128.8 89.1,128.8 78.3,118.0 78.3,102.6 89.1,91.8 104.5,91.8 115.3,102.6" fill="#a13324" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round"/><text x="96.8" y="114.3" class="micro" text-anchor="middle" style="fill:#fff8e3;letter-spacing:0">STOP</text></g><g transform="translate(40 180) rotate(15)" stroke="#322e24" stroke-width="1.6" stroke-linejoin="round"><rect x="-8" y="-6" width="16" height="12" fill="#fff8e3"/><path d="M-4 -1h8M-4 3h5" opacity=".5"/></g><g transform="translate(120 182) rotate(-20)" stroke="#322e24" stroke-width="1.6" stroke-linejoin="round"><rect x="-8" y="-6" width="16" height="12" fill="#fff8e3"/><path d="M-4 -1h8M-4 3h5" opacity=".5"/></g><g transform="translate(236 150) scale(1.5)" stroke="#322e24" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"><path d="M-18 6v15M18 6v15" fill="none" stroke-width="3"/><rect x="-25" y="-6" width="50" height="13" rx="3" fill="#d9b98a"/><rect x="-10" y="-16" width="20" height="10" rx="1.5" fill="#fff8e3" stroke-width="2"/><path d="M-6 -11h12" stroke-width="1.5" opacity=".5" fill="none"/></g><g transform="translate(236 104)" stroke="#322e24" stroke-width="2" stroke-linejoin="round"><rect x="-17" y="-12" width="34" height="24" rx="3" fill="#fff8e3"/><path d="M-17 -12L0 2L17 -12" fill="none"/><path d="M17 0l10 -14" fill="none"/><circle cx="28" cy="-17" r="4" fill="#f0c9a0"/><circle cx="-5" cy="-2" r="1.5" fill="#322e24" stroke="none"/><circle cx="5" cy="-2" r="1.5" fill="#322e24" stroke="none"/></g><g class="m-pulse"><text x="200" y="44" class="sfx" text-anchor="middle">PAUSE!</text></g><text x="236" y="214" class="b-s" text-anchor="middle">a request waits</text></svg>
