<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>Several files stacked on a cart rolling toward a desk where a worker loads them in at once.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.w{font:bold 20px Georgia,serif}
.b-s{font:15px Georgia,serif}
:where([class*="m-"]){transform-box:fill-box;transform-origin:center}
.m-spin{animation:m-spin 3s linear infinite}
.m-flow{stroke-dasharray:10 8;animation:m-flow .9s linear infinite}
@keyframes m-spin{to{transform:rotate(360deg)}}
@keyframes m-flow{to{stroke-dashoffset:-36}}
