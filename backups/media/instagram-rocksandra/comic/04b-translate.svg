y="104" width="24" height="18" fill="#fff8e3"/></g><text x="50" y="150" class="b-s" text-anchor="middle">table</text><g transform="translate(154 100) scale(0.85)"><use href="#wb" style="color:#c3b2d8"/><text x="0" y="12" class="w" text-anchor="middle">rules</text></g><path d="M92 100H116" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><path d="M194 100H222" fill="none" stroke="#a13324" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="8 7" marker-end="url(#ah)" class="m-flow"/><rect x="232" y="52" width="56" height="22" rx="3" fill="#f7d79b" stroke="#322e24" stroke-width="2"/><text x="260" y="68" class="micro" text-anchor="middle" style="letter-spacing:0">key</text><rect x="232" y="80" width="56" height="22" rx="3" fill="#a2c2a7" stroke="#322e24" stroke-width="2"/><text x="260" y="96" class="micro" text-anchor="middle" style="letter-spacing:0">value</text><rect x="232" y="108" width="56" height="22" rx="3" fill="#f7d79b" stroke="#322e24" stroke-width="2"/><text x="260" y="124" class="micro" text-anchor="middle" style="letter-spacing:0">key</text><text x="260" y="160" class="b-s" text-anchor="middle">plain boxes</text><text x="160" y="205" class="b-s" text-anchor="middle">translate between them</text></svg>
