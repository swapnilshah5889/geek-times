<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 215" role="img"><title>Most runners cross the line together while one stuck runner is stopped by a janitor with a stop sign.</title><style>text{fill:#28261e;font:17px Georgia,serif}
