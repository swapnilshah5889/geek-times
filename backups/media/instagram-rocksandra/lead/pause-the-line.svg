<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>A janitor holds a stop sign at the counter while the whole line waits.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b{font:18px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
