.m-pulse{animation:m-pulse 1.8s ease-in-out infinite}
.m-wobble{animation:m-wobble 1.8s ease-in-out infinite alternate}
@keyframes m-pulse{50%{transform:scale(1.1)}}
@keyframes m-wobble{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
