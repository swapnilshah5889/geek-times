<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>A hand lowers a new engine into an open machine while the old engine rests on the floor.</title><style>text{fill:#28261e;font:17px Georgia,serif}
.b{font:18px Georgia,serif}
.b-s{font:15px Georgia,serif}
.micro{font:bold 12px 'Courier New',monospace;letter-spacing:1px}
