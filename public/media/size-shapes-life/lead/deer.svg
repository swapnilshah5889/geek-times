)"/><path d="M176 18L172 4M176 18L162 8M190 17L196 3M190 17L204 8" fill="none" stroke="#7b5a3c" stroke-width="4"/><path d="M172 22L164 12L178 17Z" fill="#f7d79b"/><circle cx="192" cy="28" r="2.6" fill="#322e24" stroke="none"/><path d="M62 128l8 8l-8 8l8 8" fill="none" stroke="#a13324" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g></g><text x="560" y="160" text-anchor="end" class="sfx pulse">CRACK!</text><rect y="215" width="600" height="125" fill="#f0e6c8"/><path d="M0 215H600" stroke="#322e24" stroke-width="2"/><text x="300" y="253" text-anchor="middle" class="cap">Make a deer 5 times bigger…</text><text x="300" y="287" text-anchor="middle" class="cap2">it weighs <tspan font-weight="700">125×</tspan> more. Its leg bones get only <tspan font-weight="700">25×</tspan> thicker.</text><text x="300" y="320" text-anchor="middle" class="kick">SO THE LEGS GIVE WAY</text></svg>
