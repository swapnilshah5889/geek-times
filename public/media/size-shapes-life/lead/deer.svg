<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>A small deer next to a deer five times bigger whose thin legs are cracking under its weight. Below: make a deer 5 times bigger and it weighs 125 times more, but its leg bones get only 25 times thicker.</title><style>.cap{font:24px Georgia,serif;fill:#322e24}.cap2{font:19px Georgia,serif;fill:#322e24}.cap2 b{font-weight:700}.tag{font:700 11px 'Courier New',monospace;letter-spacing:1.5px;fill:#28261e}.lab{font:700 13px 'Courier New',monospace;letter-spacing:1.5px;fill:#322e24}.kick{font:700 12px 'Courier New',monospace;letter-spacing:2px;fill:#a13324}.sfx{font:italic 900 30px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}.sag{transform-box:fill-box;transform-origin:center bottom;animation:sag 3.2s ease-in-out infinite}.chop{stroke-dasharray:7 7;animation:dash 1.2s linear infinite}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes sag{0%,35%{transform:none}55%,85%{transform:scaleY(.94)}100%{transform:none}}@keyframes dash{to{stroke-dashoffset:-28}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
