<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>One big cube chopped into 125 little cubes. The outside surface gets 5 times bigger while the total amount of stuff stays the same.</title><style>.cap{font:24px Georgia,serif;fill:#322e24}.cap2{font:19px Georgia,serif;fill:#322e24}.cap2 b{font-weight:700}.tag{font:700 11px 'Courier New',monospace;letter-spacing:1.5px;fill:#28261e}.lab{font:700 13px 'Courier New',monospace;letter-spacing:1.5px;fill:#322e24}.kick{font:700 12px 'Courier New',monospace;letter-spacing:2px;fill:#a13324}.sfx{font:italic 900 30px Georgia,serif;fill:#a13324;stroke:#fff8e3;stroke-width:5px;paint-order:stroke}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-in-out infinite}.sag{transform-box:fill-box;transform-origin:center bottom;animation:sag 3.2s ease-in-out infinite}.chop{stroke-dasharray:7 7;animation:dash 1.2s linear infinite}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes sag{0%,35%{transform:none}55%,85%{transform:scaleY(.94)}100%{transform:none}}@keyframes dash{to{stroke-dashoffset:-28}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#26251f" opacity=".24"/></pattern></defs><rect width="600" height="215" fill="#e4ecdd"/><rect width="600" height="215" fill="url(#dots)" opacity=".22"/><rect x="12" y="12" width="176" height="22" fill="#f6f0df" stroke="#322e24"/><text x="22" y="27" class="tag">PLATE 02 / SURFACE</text><g transform="translate(40 -6)"><g stroke="#322e24" stroke-width="7.14286" stroke-linejoin="round"><path d="M70 70l60 -30l60 30l-60 30z" fill="#a2c2a7"/><path d="M70 70v100l60 30v-100z" fill="#f7d79b"/><path d="M190 70v100l-60 30v-100z" fill="#efae78"/></g></g><text x="170" y="206" text-anchor="middle" class="lab">1 BIG CUBE</text><path d="M255 115h60" stroke="#a13324" stroke-width="5" stroke-linecap="round"/><path d="M315 115l-12 -9v18z" fill="#a13324"/><text x="285" y="98" text-anchor="middle" class="sfx pulse">CHOP!</text><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M350 60.0l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M350 60.0v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M381.2 60.0v26l-15.6 7.8v-26z" fill="#efae78"/></g><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M400 60.0l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M400 60.0v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M431.2 60.0v26l-15.6 7.8v-26z" fill="#efae78"/></g><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M450 60.0l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M450 60.0v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M481.2 60.0v26l-15.6 7.8v-26z" fill="#efae78"/></g><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M350 92.5l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M350 92.5v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M381.2 92.5v26l-15.6 7.8v-26z" fill="#efae78"/></g><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M400 92.5l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M400 92.5v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M431.2 92.5v26l-15.6 7.8v-26z" fill="#efae78"/></g><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M450 92.5l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M450 92.5v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M481.2 92.5v26l-15.6 7.8v-26z" fill="#efae78"/></g><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M350 125.0l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M350 125.0v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M381.2 125.0v26l-15.6 7.8v-26z" fill="#efae78"/></g><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M400 125.0l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M400 125.0v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M431.2 125.0v26l-15.6 7.8v-26z" fill="#efae78"/></g><g stroke="#322e24" stroke-width="1.85714" stroke-linejoin="round"><path d="M450 125.0l15.6 -7.8l15.6 7.8l-15.6 7.8z" fill="#a2c2a7"/><path d="M450 125.0v26l15.6 7.8v-26z" fill="#f7d79b"/><path d="M481.2 125.0v26l-15.6 7.8v-26z" fill="#efae78"/></g><text x="420" y="206" text-anchor="middle" class="lab">125 LITTLE CUBES</text><rect y="215" width="600" height="125" fill="#f0e6c8"/><path d="M0 215H600" stroke="#322e24" stroke-width="2"/><text x="300" y="253" text-anchor="middle" class="cap">Same stuff. Chopped up.</text><text x="300" y="287" text-anchor="middle" class="cap2">The outside gets <tspan font-weight="700">5×</tspan> bigger. The inside stays the same.</text><text x="300" y="320" text-anchor="middle" class="kick">MORE OUTSIDE, SAME INSIDE</text></svg>
