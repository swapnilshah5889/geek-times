<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A page is squeezed, given a number tag, and placed on a shelf.</title><style>text{fill:#2b2a26;font-family:Georgia,serif}</style><rect width="320" height="220" fill="#e4e2dc"/><g><rect x="108" y="56" width="37" height="49" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(-12 160 79)"/><rect x="126" y="65" width="37" height="49" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(1 160 79)"/><rect x="145" y="75" width="37" height="49" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(-11 160 79)"/><rect x="164" y="56" width="37" height="49" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(2 160 79)"/><rect x="182" y="65" width="37" height="49" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(-10 160 79)"/></g><rect y="187" width="320" height="33" fill="#f1efe8"/><path d="M0 187H320" stroke="#555" stroke-width="2"/><rect x="12" y="12" width="160" height="22" fill="#f1efe8" stroke="#666" stroke-width="1"/><text x="20" y="28" font-size="12" font-family="Courier New,monospace" letter-spacing="1">COMIC 3C / SHELF</text><text x="160" y="212" text-anchor="middle" font-size="15">Squeeze it. Number it. File it.</text></svg>
