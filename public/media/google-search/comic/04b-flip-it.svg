<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" role="img"><title>A table flipping over, turning page-to-words into word-to-pages.</title><style>text{fill:#2b2a26;font-family:Georgia,serif}</style><rect width="320" height="220" fill="#e4e2dc"/><g><path d="M135 71a25 25 0 1 1 50 0" stroke="#555" stroke-width="2" fill="none"/><path d="M185 71l-6 -8m6 8l8 -6" stroke="#555" stroke-width="2" fill="none"/><circle cx="160" cy="71" r="7" fill="#bdbab0" stroke="#444" stroke-width="2"/></g><rect y="168" width="320" height="52" fill="#f1efe8"/><path d="M0 168H320" stroke="#555" stroke-width="2"/><rect x="12" y="12" width="151" height="22" fill="#f1efe8" stroke="#666" stroke-width="1"/><text x="20" y="28" font-size="12" font-family="Courier New,monospace" letter-spacing="1">COMIC 4B / FLIP</text><text x="160" y="192" text-anchor="middle" font-size="15">Page-to-words becomes word-to-</text><text x="160" y="212" text-anchor="middle" font-size="15">pages.</text></svg>
