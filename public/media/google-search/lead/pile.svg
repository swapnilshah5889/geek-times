<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img"><title>A huge pile of web pages with one tiny gold page buried inside. Below: So many pages, so few good ones.</title><style>text{fill:#2b2a26;font-family:Georgia,serif}</style><rect width="600" height="340" fill="#e4e2dc"/><g><rect x="214" y="92" width="61" height="80" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(-12 300 129)"/><rect x="245" y="107" width="61" height="80" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(1 300 129)"/><rect x="275" y="123" width="61" height="80" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(-11 300 129)"/><rect x="306" y="92" width="61" height="80" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(2 300 129)"/><rect x="337" y="107" width="61" height="80" fill="#d9d7cf" stroke="#555" stroke-width="2" transform="rotate(-10 300 129)"/></g><rect y="307" width="600" height="33" fill="#f1efe8"/><path d="M0 307H600" stroke="#555" stroke-width="2"/><rect x="12" y="12" width="151" height="22" fill="#f1efe8" stroke="#666" stroke-width="1"/><text x="20" y="28" font-size="12" font-family="Courier New,monospace" letter-spacing="1">PLATE 01 / PILE</text><text x="300" y="332" text-anchor="middle" font-size="15">So many pages, so few good ones.</text></svg>
