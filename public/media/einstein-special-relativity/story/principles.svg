<svg xmlns="http://www.w3.org/2000/svg" width="440" height="215" viewBox="0 0 440 215" role="img" aria-labelledby="title">
<title id="title">Two steadily moving frames with a light ray, illustrating the principles named in the paper introduction.</title>
<desc>Two steadily moving frames with a light ray, illustrating the principles named in the paper introduction.</desc>
<style>
svg{background:#f6f0df;}
text{font-family:Georgia,serif;}
@keyframes framesDrift {0%,15%{transform:translateX(0)} 45%{transform:translateX(5px)} 65%,100%{transform:translateX(0)}}
 .frame{animation:framesDrift 5s ease-in-out infinite}
 .frame:nth-of-type(2){animation-delay:2.5s}
 @keyframes rayPulse {0%,20%{transform:translateX(0);opacity:.3} 65%,100%{transform:translateX(110px);opacity:1}}
 .ray{animation:rayPulse 4s ease-in-out infinite}
 @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="440" height="215" rx="12" fill="#f6f0df"/><circle cx="18" cy="18" r="1.5" fill="#27251e" opacity=".18"/><circle cx="421" cy="18" r="1.5" fill="#27251e" opacity=".18"/><circle cx="18" cy="197" r="1.5" fill="#27251e" opacity=".18"/><circle cx="421" cy="197" r="1.5" fill="#27251e" opacity=".18"/><circle cx="220.0" cy="12" r="1.5" fill="#27251e" opacity=".18"/><rect x="5" y="5" width="430" height="205" rx="10" fill="none" stroke="#27251e" stroke-width="2"/><g class="frame"><rect x="57.2" y="64.5" width="149.60000000000002" height="77.39999999999999" rx="8" fill="#f0e3c6" stroke="#27251e" stroke-width="2.4"/></g><g class="frame"><rect x="233.20000000000002" y="64.5" width="149.60000000000002" height="77.39999999999999" rx="8" fill="#f0e3c6" stroke="#27251e" stroke-width="2.4"/></g><path d="M193.6 103.2 L242.00000000000003 103.2 M233.00000000000003 107.2 L242.00000000000003 103.2 L233.00000000000003 99.2" fill="none" stroke="#a13324" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="220.0" y="184.9" text-anchor="middle" font-family="Courier New" font-size="17" fill="#27251e">STEADY MOTION</text>
</svg>