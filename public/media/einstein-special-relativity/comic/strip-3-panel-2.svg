<svg xmlns="http://www.w3.org/2000/svg" width="320" height="220" viewBox="0 0 320 220" role="img" aria-labelledby="title">
<title id="title">Matching simple physics symbols appear in two steadily moving frames.</title>
<desc>Matching simple physics symbols appear in two steadily moving frames.</desc>
<style>
svg{background:#f6f0df;}
text{font-family:Georgia,serif;}
@keyframes framesDrift {0%,15%{transform:translateX(0)} 45%{transform:translateX(5px)} 65%,100%{transform:translateX(0)}}
 .frame{animation:framesDrift 5s ease-in-out infinite}
 .frame:nth-of-type(2){animation-delay:2.5s}
 @keyframes rayPulse {0%,20%{transform:translateX(0);opacity:.3} 65%,100%{transform:translateX(110px);opacity:1}}
 .ray{animation:rayPulse 4s ease-in-out infinite}
 @media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<rect width="320" height="220" rx="12" fill="#f6f0df"/><circle cx="18" cy="18" r="1.5" fill="#27251e" opacity=".18"/><circle cx="301" cy="18" r="1.5" fill="#27251e" opacity=".18"/><circle cx="18" cy="202" r="1.5" fill="#27251e" opacity=".18"/><circle cx="301" cy="202" r="1.5" fill="#27251e" opacity=".18"/><circle cx="160.0" cy="12" r="1.5" fill="#27251e" opacity=".18"/><rect x="5" y="5" width="310" height="210" rx="10" fill="none" stroke="#27251e" stroke-width="2"/><g class="frame"><rect x="41.6" y="66.0" width="108.80000000000001" height="79.2" rx="8" fill="#f0e3c6" stroke="#27251e" stroke-width="2.4"/><circle cx="96.0" cy="100.6" r="13" fill="#a2c2a7" stroke="#27251e" stroke-width="2"/><path d="M88.0 100.6 h16 M96.0 92.6 v16" stroke="#27251e" stroke-width="2"/></g><g class="frame"><rect x="169.60000000000002" y="66.0" width="108.80000000000001" height="79.2" rx="8" fill="#f0e3c6" stroke="#27251e" stroke-width="2.4"/><circle cx="224.00000000000003" cy="100.6" r="13" fill="#a2c2a7" stroke="#27251e" stroke-width="2"/><path d="M216.00000000000003 100.6 h16 M224.00000000000003 92.6 v16" stroke="#27251e" stroke-width="2"/></g><path d="M140.8 105.6 L176.0 105.6 M167.0 109.6 L176.0 105.6 L167.0 101.6" fill="none" stroke="#a13324" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="160.0" y="189.2" text-anchor="middle" font-family="Courier New" font-size="15" fill="#27251e">STEADY MOTION</text>
</svg>