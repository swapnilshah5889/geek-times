ll="none" stroke="#a13324" stroke-width="3" stroke-linecap="round"/></g><g class="m-bob" style="animation-delay:0.75s;"><path d="M76 100q-5 -8 0 -16q5 -8 0 -16" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round"/></g><g class="m-bob" style="animation-delay:1.0s;"><path d="M90 100q-5 -8 0 -16q5 -8 0 -16" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round"/></g><g transform="translate(212 94) scale(0.62)" stroke="#322e24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><rect x="-52" y="20" width="22" height="48" rx="8" fill="#a9a29a"/><rect x="-14" y="22" width="22" height="46" rx="8" fill="#a9a29a"/><rect x="30" y="22" width="22" height="46" rx="8" fill="#a9a29a"/><rect x="62" y="20" width="22" height="48" rx="8" fill="#a9a29a"/><ellipse cx="14" cy="6" rx="78" ry="44" fill="#bdb6ac"/><ellipse cx="82" cy="-6" rx="34" ry="30" fill="#bdb6ac"/><path d="M106 4q22 8 14 44q-2 12 -12 6" fill="none" stroke-width="9"/><path d="M106 4q22 8 14 44q-2 12 -12 6" fill="none" stroke="#bdb6ac" stroke-width="5"/><ellipse cx="62" cy="-8" rx="18" ry="22" fill="#a9a29a"/><circle cx="92" cy="-12" r="3" fill="#322e24" stroke="none"/></g><g class="m-bob" style="animation-delay:0.0s;"><path d="M176 62q-5 -8 0 -16q5 -8 0 -16" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round"/></g><g class="m-bob" style="animation-delay:0.25s;"><path d="M190 62q-5 -8 0 -16q5 -8 0 -16" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round"/></g><g class="m-bob" style="animation-delay:0.0s;"><path d="M228 60q-5 -8 0 -16q5 -8 0 -16" fill="none" stroke="#a13324" stroke-width="3" stroke-linecap="round"/></g><text x="70" y="202" class="micro" text-anchor="middle">LOTS of outside</text><text x="232" y="202" class="micro" text-anchor="middle">less outside</text></svg>
